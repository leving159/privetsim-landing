body{margin:0;background:#FFFFFF;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}

      showPop: !q && this.state.tab === 'countries' && reg === 'all',
      pop: PS.POPULAR.slice(0, 12).filter((c) => PS_CATALOG.countries[c]).map((c, i) => { const k = PS.country(c); return { name: k.name, flag: PS.flagOf(c), href: PS.dest(c), sub: 'от\u00a0' + PS.from(c) + ' ₽ · ' + k.net, n: String(i + 1).padStart(2, '0') }; }),
      abc: [...new Set(items.map((x) => x.name.charAt(0).toUpperCase()))].map((L) => ({ l: L, go: () => { const el = document.getElementById('ps-L-' + L.charCodeAt(0)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } })),
      q: this.state.q, hasQ: !!q, empty: !!q && items.length === 0, count: items.length,
      qBorder: q ? '#2F5BFF' : '#E3E6ED', qRing: q ? '0 0 0 4px rgba(47,91,255,0.15)' : 'none',
      onQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => this.setState({ q: '' }),
      showRegions: () => this.setState({ q: '', tab: 'regions' })
    };
  }
}
</script>


<script>window.PS && PS.applyUrlProps();</script>
