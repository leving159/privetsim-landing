<style>
body{margin:0;background:#FFFFFF;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.nav a{color:#0E1220;text-decoration:none}.nav a:hover{color:#2F5BFF}
.dnav a{display:block;padding:12px 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;line-height:21px;transition:background-color .16s}
.dnav a:hover{background:#F5F6F9;color:#0E1220}
.dnav a.on{background:#F2F5FF;color:#1F45D6;font-weight:600}
.prose h2{margin:48px 0 16px;font-size:24px;line-height:30px;letter-spacing:-0.02em;font-weight:600;scroll-margin-top:96px}
.prose p{margin:0 0 16px;font-size:17px;line-height:28px;color:#2B3142;max-width:68ch}
.prose .cl{display:grid;grid-template-columns:56px 1fr;gap:8px;margin:0 0 12px;font-size:17px;line-height:28px;color:#2B3142;max-width:72ch}
.ph{color:#5A6175;background:#F5F6F9;border-radius:6px;padding:1px 6px}
@media (max-width:899px){.nav{display:none !important}.dnav{flex-direction:row !important;overflow-x:auto}.dnav a{white-space:nowrap}}
@media (max-width:767px){.wrap{padding:0 16px}}
.dn{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-radius:14px;background:transparent;color:#2B3142;font:400 15px/21px 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s,color .16s,transform .2s}
.dn:hover{background:#F5F6F9;color:#0E1220;transform:translateX(2px)}
.dn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.dn.on{background:#F2F5FF;color:#1F45D6;font-weight:600}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:#F5F6F9;color:#0E1220;text-decoration:none;font-size:14px}
.chip:hover{background:#EDEFF3;color:#0E1220}
.prose h3{margin:32px 0 12px;font-size:19px;line-height:26px;font-weight:600}
.prose ul{margin:0 0 16px;padding-left:22px;font-size:17px;line-height:28px;color:#2B3142;max-width:68ch}
.prose li{margin:0 0 8px}
.short{margin:28px 0 8px;padding:20px 24px;border-radius:20px;background:#F2F5FF;font-size:16px;line-height:25px;color:#1F45D6;max-width:68ch}
.tbl{overflow-x:auto;margin:0 0 20px;border-radius:16px;box-shadow:inset 0 0 0 1px #E3E6ED}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:22px;min-width:520px}
.tbl th{text-align:left;font-weight:600;color:#5A6175;font-size:13px;letter-spacing:.02em;background:#F5F6F9;padding:12px 16px}
.tbl td{padding:14px 16px;border-top:1px solid #E3E6ED;color:#2B3142;vertical-align:top}
.draft{margin-top:56px !important;font-size:14px !important;line-height:21px !important;color:#5A6175 !important}
@media (max-width:899px){.dn{white-space:nowrap;width:auto}}
/* движение */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
article>*:nth-child(-n+3),aside{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
article{animation:fadeUp .7s .1s cubic-bezier(.2,.8,.2,1) both}
.dnav a{transition:background-color .16s,color .16s,transform .2s}
.dnav a:hover{transform:translateX(2px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ———— Чат поддержки (виджет) ———— */
.cw{position:fixed;right:24px;bottom:24px;z-index:60;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#0E1220}
.cw>summary{list-style:none;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border-radius:999px;background:#2F5BFF;color:#FFFFFF;font:600 15px/1 'Onest',system-ui,sans-serif;box-shadow:0 16px 36px rgba(47,91,255,.35);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .16s;float:right}
.cw>summary::-webkit-details-marker{display:none}
.cw>summary:hover{background:#1F45D6;transform:translateY(-2px)}

      </div>
<div role="note" class="short">Коротко: вы покупаете eSIM с мобильным интернетом за границей. Цена в рублях фиксируется при переходе к оплате. Установите eSIM накануне вылета, срок пакета пойдёт с первого подключения в стране поездки. Пока eSIM не установлена, вернём деньги полностью на баланс сразу. После установки возврат только по заявке и на наше усмотрение.</div>
<p>Продавец предлагает любому дееспособному лицу купить доступ к мобильному интернету за границей через eSIM на условиях ниже. Оплата заказа означает согласие с офертой.</p>
<h2 id="o1">1. Термины</h2>
<div class="cl"><span class="mono" style="color: #5A6175">1.1</span><span><b style="font-weight: 600; color: #0E1220">Сервис</b> — сайт privetsim.app, Telegram-бот и Telegram Mini App «Привет SIM».</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.2</span><span><b style="font-weight: 600; color: #0E1220">eSIM</b> — цифровой профиль, который устанавливается на совместимый телефон по QR-коду или коду активации.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.3</span><span><b style="font-weight: 600; color: #0E1220">Пакет</b> — объём трафика и срок действия в стране или регионе. Бывает «на весь срок» и «с лимитом в день».</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.4</span><span><b style="font-weight: 600; color: #0E1220">Активация</b> — первое подключение eSIM к сети в стране покрытия.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.5</span><span><b style="font-weight: 600; color: #0E1220">Баланс</b> — сумма в рублях в личном кабинете. Состоит из собственных средств и бонусов.</span></div>
<h2 id="o2">2. Предмет</h2>
<div class="cl"><span class="mono" style="color: #5A6175">2.1</span><span>Продавец передаёт покупателю eSIM с выбранным пакетом, а покупатель её оплачивает.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.2</span><span>Продавец не является оператором связи. Связь предоставляют местные операторы через поставщика eSIM. Операторы и тип сети указаны на странице страны.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.3</span><span>eSIM даёт только мобильный интернет. Номера телефона, звонков и SMS нет.</span></div>
<h2 id="o3">3. Заказ и оплата</h2>
<div class="cl"><span class="mono" style="color: #5A6175">3.1</span><span>Для заказа покупатель выбирает пакет и указывает email. После первого заказа на этот email автоматически создаётся личный кабинет.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.2</span><span>Цена указана в рублях и может меняться вслед за курсом. Цена, показанная при переходе к оплате, фиксируется для этого заказа.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.3</span><span>Способы оплаты: СБП через платёжного агента <span class="ph">[Платёжный агент]</span>; с баланса личного кабинета (бонусы списываются первыми); криптовалютой USDT в сетях TON, TRC-20 или BEP-20 (раздел 4). Платёжный агент принимает деньги в пользу продавца и не является стороной договора. Ссылка на оплату по СБП действует 30 минут, после этого неоплаченный платёж отменяется и заказ нужно оформить заново.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.4</span><span>Заказ считается оплаченным, когда продавец получил подтверждение оплаты от платёжного агента или из блокчейна. Подтверждение оплаты приходит на email и хранится в личном кабинете.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.5</span><span>Промокоды действуют на условиях конкретной акции и не обмениваются на деньги. Один промокод можно использовать один раз на email и один раз на карту или кошелёк.</span></div>
<h2 id="o4">4. Оплата криптовалютой</h2>
<div class="cl"><span class="mono" style="color: #5A6175">4.1</span><span>Сумма в USDT считается по курсу Сервиса в момент создания счёта. Счёт действует 30 минут.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">4.2</span><span>Покупатель переводит ровно указанную сумму в указанной сети и, для TON, с указанным комментарием. Комиссии сети и биржи платит покупатель.</span></div>
