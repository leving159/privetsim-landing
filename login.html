<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap;width:100%;box-sizing:border-box}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-dark{background:#0E1220;color:#FFFFFF}.btn-dark:hover{background:#2B3142;color:#FFFFFF}
.lnk{border:0;background:transparent;padding:0;font:600 14px/1.4 'Onest',system-ui,sans-serif;color:#2F5BFF;cursor:pointer}
.lnk:hover{color:#1F45D6;text-decoration:underline;text-underline-offset:3px}
/* движение */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}70%{transform:scale(1.1) rotate(2deg)}100%{transform:none;opacity:1}}
main>div{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
main>div>div{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
input[aria-invalid="true"]{animation:shake .3s}
[role=alert]{animation:fadeUp .3s both}
main>div>div svg[width="72"]{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.btn:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

.btn-ghost-out{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost-out:hover{background:#F5F6F9;color:#0E1220}
.g-slot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #C5CAD6;display:inline-flex;align-items:center;justify-content:center;font:700 12px/1 'Onest',sans-serif;color:#5A6175}
/* ———— Чат поддержки (виджет) ———— */
.cw{position:fixed;right:24px;bottom:24px;z-index:60;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#0E1220}
.cw>summary{list-style:none;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border-radius:999px;background:#2F5BFF;color:#FFFFFF;font:600 15px/1 'Onest',system-ui,sans-serif;box-shadow:0 16px 36px rgba(47,91,255,.35);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .16s;float:right}
.cw>summary::-webkit-details-marker{display:none}
.cw>summary:hover{background:#1F45D6;transform:translateY(-2px)}
.cw-x{display:none}
.cw[open]>summary{width:56px;padding:0;justify-content:center;background:#0E1220}
.cw[open] .cw-i,.cw[open] .cw-l,.cw[open] .cw-dot{display:none}
.cw[open] .cw-x{display:block}
.cw-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#FF7A45;box-shadow:0 0 0 3px #FFFFFF}
@keyframes cwIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.cw-pop{position:absolute;right:0;bottom:72px;width:380px;height:560px;max-height:calc(100vh - 110px);display:flex;flex-direction:column;border-radius:28px;background:#FFFFFF;box-shadow:0 30px 80px rgba(14,18,32,.22),0 0 0 1px #EDEFF3;overflow:hidden;transform-origin:bottom right;animation:cwIn .3s cubic-bezier(.2,.8,.2,1) both}
.cw-hd{display:flex;align-items:center;gap:12px;padding:18px 20px;background:linear-gradient(135deg,#2F5BFF,#6A4CF5);color:#FFFFFF}
.cw-avs{display:flex}
.cw-avs span{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 2px #4A47F0;display:inline-flex;align-items:center;justify-content:center;font:600 13px/1 'Onest',sans-serif;color:#0E1220}
.cw-avs span+span{margin-left:-10px}
.cw-on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3DDC84;margin-right:6px;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.cw-bd{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:18px 18px 14px;background:#F5F6F9}
.cw-go{position:absolute;opacity:0;pointer-events:none}
.cw-s2{display:none}
.cw-go:checked~.cw-s1{display:none}
.cw-go:checked~.cw-s2{display:flex}
.cw-m{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:20px}
.cw-op{align-self:flex-start;background:#FFFFFF;border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(14,18,32,.05)}
.cw-me{align-self:flex-end;background:#2F5BFF;color:#FFFFFF;border-bottom-right-radius:6px}
.cw-meta{font-size:11px;color:#8C92A3}
.cw-sys{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#E4F5EA;color:#0B5C2E;font-size:12px;font-weight:500}
.cw-in{min-width:0;box-sizing:border-box;display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 16px;border-radius:999px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E3E6ED}
.cw-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:400 15px/20px 'Onest',system-ui,sans-serif;color:#0E1220}
.cw-send{width:36px;height:36px;border-radius:50%;border:0;background:#2F5BFF;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cw-btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:999px;background:#2F5BFF;color:#FFFFFF;font:600 15px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s}
.cw-btn:hover{background:#1F45D6}

.cw-q span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E3E6ED;font-size:13px;font-weight:500;color:#1F45D6;cursor:pointer}

.cw-typ i{width:6px;height:6px;border-radius:50%;background:#8C92A3;animation:cwType 1.2s infinite}
.cw-typ i:nth-child(2){animation-delay:.15s}.cw-typ i:nth-child(3){animation-delay:.3s}
@media (max-width:599px){.cw{right:16px;bottom:16px}.cw-pop{position:fixed;inset:12px 12px 84px;width:auto;max-height:none}.cw-l{display:none}.cw>summary{width:56px;padding:0;justify-content:center}}
/* ———— Общая шапка и подвал (единые для всех страниц) ———— */
.sh{position:sticky;top:0;z-index:30;padding:12px 16px 0}
.sh-in{max-width:1200px;margin:0 auto;height:64px;padding:0 12px 0 20px;border-radius:20px;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border:1px solid #EDEFF3;box-shadow:0 10px 30px rgba(14,18,32,.06);display:flex;align-items:center;justify-content:space-between;gap:24px;box-sizing:border-box}
.sh-logo{display:flex;align-items:center;gap:10px;color:#0E1220;text-decoration:none;flex:none}
.sh-logo:hover{color:#0E1220}
.sh-desc{font-size:12px;line-height:15px;color:#5A6175;white-space:nowrap}
.sh-sep{width:1px;height:28px;background:#E3E6ED;margin-left:4px}
.sh-nav{display:flex;gap:28px;font:500 15px/1 'Onest',system-ui,sans-serif}
.sh-nav a{color:#2B3142;text-decoration:none;padding:8px 0;position:relative;transition:color .16s}
.sh-nav a:hover{color:#2F5BFF}
.sh-nav a.on{color:#0E1220;font-weight:600}
.sh-nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:#2F5BFF}
.sh-act{display:flex;gap:8px;align-items:center;flex:none}
.sh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:0;font:600 14px/1 'Onest',system-ui,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;box-sizing:border-box}
.sh-btn:hover{transform:translateY(-1px)}
.sh-pri{background:#2F5BFF;color:#FFFFFF}.sh-pri:hover{background:#1F45D6;color:#FFFFFF;box-shadow:0 10px 24px rgba(47,91,255,.28)}
.sh-gho{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.sh-gho:hover{background:#F5F6F9;color:#0E1220}
.sh-ava{position:relative;width:40px;height:40px;border-radius:50%;background:#E6ECFF;color:#1F45D6;display:inline-flex;align-items:center;justify-content:center;font:600 15px/1 'Onest',system-ui,sans-serif;text-decoration:none;flex:none}
.sh-ava:hover{color:#1F45D6}
.sh-burger{display:none;width:40px;padding:0}
.sf{background:#FFFFFF;border-top:1px solid #EDEFF3;padding:64px 0 0;overflow:hidden;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#0E1220}
.sf-w{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;flex-direction:column;gap:56px;box-sizing:border-box}
.sf-mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5A6175}
.sf-col{display:flex;flex-direction:column;gap:12px;font-size:15px}
.sf-col a{color:#2B3142;text-decoration:none;transition:color .16s}.sf-col a:hover{color:#2F5BFF}
.sf-pay{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:10px;background:#FFFFFF;font-size:13px;font-weight:500;color:#2B3142}
.sf-line{margin-top:-16px;padding-bottom:40px}.sf-line svg{display:block;width:100%;height:auto;overflow:visible}@keyframes sfDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.sf-draw{stroke-dasharray:1;animation:sfDraw 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes sfFlow{to{stroke-dashoffset:-56}}.sf-flow{animation:sfFlow 2.4s linear infinite}@keyframes sfPulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(3);opacity:0}}.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sfPulse 2.4s ease-out infinite}
@media (max-width:899px){.sh-nav{display:none !important}.sh-hm{display:none !important}.sh-burger{display:inline-flex}}
@media (max-width:767px){.sf-w{padding:0 16px}}

  <main style="flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px 120px">

        });
      },
      code: s.code, cErr: s.cErr, hasCErr: !!s.cErr, cInvalid: s.cErr ? 'true' : 'false', locked,
      cBorder: s.cErr ? '#C62F35' : '#E3E6ED', cBg: locked ? '#F5F6F9' : (s.cErr ? '#FFFBFB' : '#FFFFFF'),
      btnBg: locked ? '#EDEFF3' : '#2F5BFF', btnFg: locked ? '#8C92A3' : '#FFFFFF',
      onCode: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6), cErr: locked ? s.cErr : '' }),
      back: () => this.setState({ step: 'email' }),
      refShow: refCode, demoCode: PSA.demoCode(s.email), hasDemo: !!PSA.demoCode(s.email), waitResend: wait > 0, canResend: wait <= 0, resendIn: Math.floor(wait / 60) + ':' + String(wait % 60).padStart(2, '0'), resend: sendCode,
      nextHref: PSA.nextUrl(), nextLabel: PSA.nextUrl() === 'account.html' ? 'Мои eSIM' : 'Продолжить',
      isTgWait: s.step === 'tg', isTgFail: s.step === 'tgFail', isGFail: s.step === 'gFail', isMerge: s.step === 'merge',
      tgCode: (s.tg && s.tg.code) || '···', tgUrl: (s.tg && s.tg.url) || '#', tgReady: !!(s.tg && s.tg.url),
      tgErr: s.tgErr || 'Telegram не\u00a0подтвердил вход. Попробуйте ещё раз или войдите по\u00a0коду из\u00a0письма.',
      gErr: PSA.authError(PS.qp('error')) || PSA.authError('google_failed'), mergeEmail: PSA.googlePending(),
      toEmail: () => { PSA.tgCancel(); this.setState({ step: 'email', tg: null }); },
      psTg: () => {
        if (!PSA.providers().telegram) return note(PSA.DEMO ? 'Вход через Telegram заработает после подключения сервера' : 'Вход через Telegram временно недоступен. Войдите по\u00a0коду из\u00a0письма');
        this.setState({ step: 'tg', tg: null, tgErr: '' });
        PSA.tgStart(false, (st) => {
          if (st.status === 'ok') { this.setState({ step: 'done' }); if (PS.qp('next')) setTimeout(() => PS.go(PSA.nextUrl()), 900); return; }
          if (st.status === 'fail') return this.setState({ step: 'tgFail', tgErr: st.text || '' });
          if (st.status === 'wait') this.setState({ tg: { code: st.code, url: st.url } });
        });
      },
      psGoogle: () => {
        if (!PSA.providers().google) return note(PSA.DEMO ? 'Вход через Google заработает после подключения сервера' : PSA.authError('google_off'));
        window.location.href = PSA.googleUrl(PSA.nextUrl());
      },
      sendMerge: () => {
        const v = PSA.googlePending();
        this.setState({ email: v });
        PSA.then(PSA.requestCode(v), (r) => {
          if (r.err) return this.setState({ step: 'email', eErr: r.text || 'Новый код можно запросить через ' + r.wait + ' с' });
          this.setState({ step: 'code', code: '', cErr: '', tries: 3 });
        });
      },
      submitCode: () => {
        if (locked) return;
        if (s.code.length < 6) return this.setState({ cErr: 'Введите все 6 цифр' });
        return PSA.then(PSA.verifyLogin(s.email, s.code, refCode), (r) => {
        if (r.ok) { this.setState({ step: 'done', refApplied: r.invited && r.isNew }); if (PS.qp('next')) setTimeout(() => PS.go(PSA.nextUrl()), 900); return; }
        if (r.err === 'invalid') return this.setState({ tries: r.left, cErr: 'Неверный код. Осталось попыток: ' + r.left });
        if (r.err === 'expired') return this.setState({ tries: 0, cErr: 'Код устарел. Запросите новый' });
        if (r.text) return this.setState({ cErr: r.text });
        this.setState({ tries: 0, cErr: 'Слишком много попыток. Запросите новый код' });
        });
      }
    };
  }
}
</script>


<script>window.PS && PS.applyUrlProps();</script>
