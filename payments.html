<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(30px,3.4vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:600}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-secondary{background:#F2F5FF;color:#1F45D6}.btn-secondary:hover{background:#E6ECFF;color:#1F45D6}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;font-weight:500;transition:background-color .16s}
.side a:hover{background:#EDEFF3;color:#0E1220}
.side a.on{background:#FFFFFF;color:#0E1220;font-weight:600;box-shadow:0 1px 2px rgba(14,18,32,0.06)}
.row{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid #EDEFF3;flex-wrap:wrap}
@media (max-width:899px){.side{flex-direction:row !important;overflow-x:auto}.side a{white-space:nowrap}}
@media (max-width:767px){.wrap{padding:0 16px}}
/* движение */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
main>*{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}main>*:nth-child(4){animation-delay:.24s}
[role=progressbar]>div{transform-origin:left;animation:grow 1.2s .4s cubic-bezier(.2,.8,.2,1) both}
.side a{transition:background-color .16s,color .16s,transform .2s}
.side a:hover{transform:translateX(2px)}
.btn{transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes coin{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.flow{stroke-dasharray:6 8;animation:flow 2.4s linear infinite}
.bob{animation:bob 5s ease-in-out infinite}
.coin{animation:coin 3.2s ease-in-out infinite}
@keyframes rfRoll{0%,74%{transform:translateY(0)}80%,94%{transform:translateY(-1.15em)}100%{transform:translateY(0)}}
@keyframes rfPlus{0%,72%{opacity:0;transform:translateY(8px) scale(.6)}78%{opacity:1;transform:translateY(0) scale(1.15)}82%,92%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes rfSend{0%,6%{transform:none;box-shadow:0 0 0 0 rgba(255,122,69,.6)}9%{transform:scale(.9)}14%{transform:none;box-shadow:0 0 0 10px rgba(255,122,69,0)}100%{transform:none}}
@keyframes rfPhone{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-6px)}}
@keyframes rfOk{0%,55%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.7)}60%{opacity:1;transform:translateX(-50%) scale(1.08)}64%,92%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%)}}
@keyframes rfRing{0%,54%{opacity:0;transform:scale(1)}58%{opacity:.8;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.7)}}
@keyframes cf{0%,57%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}61%{opacity:1;transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.3)) rotate(calc(var(--r)*.3)) scale(1)}80%{opacity:1}88%,100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 30px)) rotate(var(--r)) scale(.8)}}
@keyframes rfCoin{0%,57%{opacity:0;transform:translate(0,0) scale(.2) rotateY(0)}63%{opacity:1;transform:translate(0,-56px) scale(1.15) rotateY(180deg)}68%{transform:translate(0,-60px) scale(1) rotateY(360deg)}78%{opacity:1;transform:translate(-110px,-150px) scale(.55) rotateY(540deg)}80%,100%{opacity:0;transform:translate(-112px,-152px) scale(.4) rotateY(540deg)}}
