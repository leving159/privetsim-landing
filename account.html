body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(30px,3.4vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:600}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-secondary{background:#F2F5FF;color:#1F45D6}.btn-secondary:hover{background:#E6ECFF;color:#1F45D6}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;font-weight:500;transition:background-color .16s}
.side a:hover{background:#EDEFF3;color:#0E1220}
.side a.on{background:#FFFFFF;color:#0E1220;font-weight:600;box-shadow:0 1px 2px rgba(14,18,32,0.06)}

<sc-if value="{{hasWaits}}" hint-placeholder-val="{{ true }}">

</sc-if>

            <div style="display: flex; align-items: flex-start; gap: 14px">

              <button type="button" sc-camel-on-click="{{gClose}}" aria-label="Закрыть" class="tp-x"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </div>

            <label class="g-f"><span>Сообщение <span style="color: #8C92A3">— необязательно</span></span><textarea rows="2" placeholder="Хорошей поездки! Установи eSIM за день до вылета"></textarea></label>

    const ARCH = { expired: (e) => 'Действовала ' + PSA.d(e.activatedAt) + ' — ' + PSA.dy(e.expiresAt), burned: (e) => 'Не установили до\u00a0' + PSA.dy(e.installBy), refunded: (e) => 'Возврат ' + (e.refund ? e.refund.no : '') + ' · деньги на\u00a0балансе', deleted: (e) => 'Удалена из\u00a0телефона' };
    const arch0 = L.filter((e) => e.archived).map((e) => ({ t: e.label, d: ARCH[e.st](e), used: e.activatedAt ? PSA.gbShort(e.used) + ' из\u00a0' + PSA.gb(e.total) : '—', img: e.photo, flag: e.flag, stText: e.stText, buy: e.buyHref }));
    const arch = arch0.map((a, i) => ({ ...a, bb: i === arch0.length - 1 ? '0' : '1px solid #EDEFF3' }));
    const tabs = [['act', 'Активные', actives.length + waits.length], ['arch', 'Архив', arch0.length]].map(([id, label, n]) => {
      const on = s.tab === id;
      return { label, n, on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0E1220' : '#5A6175', sh: on ? '0 1px 2px rgba(14,18,32,0.08)' : 'none', cbg: on ? '#2F5BFF' : '#FFFFFF', cfg: on ? '#FFFFFF' : '#5A6175', pick: () => this.setState({ tab: id }) };
    });
    const O = PSA.orders();
    const orders = O.map((o, i) => {
      const ri = o.kind !== 'balance' && o.status === 'paid' ? PSA.refundInfo(o.id) : null;
      const canRefund = !!(ri && ri.esim && !o.refund && ri.esim.canRefund);
      const st = o.status === 'refunded' ? 'возвращён' : (o.refund && o.refund.status === 'review' ? 'возврат на\u00a0рассмотрении' : (o.status === 'late' ? 'зачислен на\u00a0баланс' : ''));
      return { id: o.id, date: PSA.dnum(o.paidAt || o.created), no: '#' + o.no, what: o.kind === 'balance' ? 'Пополнение баланса' : o.label + (o.qty > 1 ? ' × ' + o.qty : ''), pay: PSA.payName(o), sum: R(o.sum),
        bb: i === O.length - 1 ? '0' : '1px solid #EDEFF3', canRefund, refundHref: ri && ri.esim ? 'esim.html?id=' + ri.esim.id + '&refund=' + o.id : '#', hasState: !!st, state: st, rc: PSA.receipt(o) };
    });
    // Пополнение
    const tE0 = L.find((e) => e.id === s.tId) || actives[0] || null;
    const open = !!tE0 && (s.open === null ? !!(this.props.topupOpen ?? false) || !!PS.qp('topup') : s.open);
    const plans = tE0 ? PSA.topupPlans(tE0.id) : [];
    const k = Math.min(s.k, Math.max(0, plans.length - 1));
    const hit = plans.findIndex((p) => p.n >= 3);
    const packs = plans.map((p, i) => {
      const on = k === i;
      return { gb: p.gb.replace(/\/(день|day)$/, ''), days: '+' + (p.daysShort ? PSA.days(parseInt(p.daysShort, 10)) : 'к\u00a0лимиту'), price: R(p.price), hit: i === hit, on: on ? 'true' : 'false', ring: on ? 'inset 0 0 0 2px #2F5BFF' : 'inset 0 0 0 1px #E3E6ED', bg: on ? '#F2F5FF' : '#FFFFFF', pick: () => this.setState({ k: i, tErr: '' }) };
    });
    const sel = plans[k];
    const B = PSA.balance();
    const after = tE0 && sel ? (tE0.activatedAt ? tE0.left : tE0.total) + sel.n : 0;
    const pays = ['С баланса · ' + R(B.total), 'СБП', 'USDT'].map((label, i) => {
      const on = s.pay === i;
      return { label, ring: on ? 'inset 0 0 0 2px #2F5BFF' : 'inset 0 0 0 1px #E3E6ED', bg: on ? '#F2F5FF' : '#FFFFFF', pick: () => this.setState({ pay: i, tErr: '' }) };
    });
    const g = L.find((e) => e.id === s.gId);
    return {
      gOpen: !!s.gOpen, gForm: !!s.gOpen && !s.gDone, gDone: !!s.gDone, gName: g ? g.label : '', gEmail: s.gEmail || '', gErr: !!s.gErr, gBorder: s.gErr ? '#C62F35' : '#E3E6ED',
      gOnEmail: (e) => this.setState({ gEmail: e.target.value, gErr: false }),
      gOpenFn: () => this.setState({ gOpen: true, gDone: false, gErr: false }),
      gClose: () => this.setState({ gOpen: false, gDone: false }),
      gSend: () => { const v = (s.gEmail || '').trim(); if (!PSA.validEmail(v)) { this.setState({ gErr: true }); return; } PSA.sendToFriend(s.gId, v); this.setState({ gDone: true }); },
      tabs, arch, noArch: !arch.length, tAct: s.tab === 'act', tArch: s.tab === 'arch',
      actives, waits, hasWaits: waits.length > 0, noEsims: !actives.length && !waits.length,
      orders, hasOrders: orders.length > 0, noOrders: !orders.length,
      tOpen: open, tPick: s.step === 'pick', tDone: s.step === 'done',
      tE: tE0 ? { flag: tE0.flag, name: tE0.name, leftGb: PSA.gb(tE0.activatedAt ? tE0.left : tE0.total), until: tE0.activatedAt ? until(tE0) : 'срок начнётся с\u00a0подключения', iccidShort: tE0.iccidShort } : { flag: '', name: '', leftGb: '', until: '', iccidShort: '' },
      openTop: () => this.setState({ open: true, step: 'pick' }),
      closeTop: () => this.setState({ open: false, step: 'pick' }),
      packs, pays, selGb: s.step === 'done' && s.doneSel ? s.doneSel : (sel ? PSA.gb(sel.n) : ''), afterGb: PSA.gb(after), after: s.step === 'done' && s.doneAfter ? s.doneAfter : PSA.gb(after) + (tE0 && tE0.activatedAt ? ' до\u00a0' + PSA.d(tE0.expiresAt) : ''),
      payLabel: s.pay === 0 ? 'с баланса' : (sel ? R(sel.price) : ''), bonusNote: s.pay === 0 ? 'Спишем с баланса, доступно ' + R(B.total) : 'Оплата по СБП или в USDT',
      tErr: !!s.tErr, tErrText: s.tErr || '',
      payTop: () => {
        if (!sel || !tE0) return;
        if (s.pay === 0 && B.total < sel.price) return this.setState({ tErr: 'На балансе ' + R(B.total) + ' — не хватает ' + R(sel.price - B.total) + '. Выберите СБП или USDT' });
        PSA.then(PSA.createOrder({ kind: 'topup', code: tE0.code, pkg: sel.code, esimId: tE0.id, method: ['balance', 'sbp', 'usdt'][s.pay] }), (o) => {
        if (!o || o.err) return;
        if (o.status === 'paid') this.setState({ step: 'done', doneSel: PSA.gb(sel.n), doneAfter: PSA.gb(after) + (tE0.activatedAt ? ' до\u00a0' + PSA.d(tE0.expiresAt) : '') }); else PS.go(PSA.payUrl(o));
        });
      }
    };
  }
}
</script>
