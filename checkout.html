<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1080px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(30px,3.4vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:600}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn:active{transform:scale(0.98)}
.btn-lg{height:56px;padding:0 28px;font-size:17px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-secondary{background:#F2F5FF;color:#1F45D6}.btn-secondary:hover{background:#E6ECFF;color:#1F45D6}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.opt{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;box-sizing:border-box;border:0;transition:box-shadow .16s,background-color .16s}
.opt:hover{background:#FAFBFC}
.opt:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.lnk{border:0;background:transparent;padding:0;font:600 13px/1.4 'Onest',system-ui,sans-serif;color:#2F5BFF;cursor:pointer}
@media (max-width:767px){.wrap{padding:0 16px}}
/* движение */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
main>*{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}
[role=alert],[role=note]{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
input[aria-invalid="true"]{animation:shake .3s}
svg:has(> path[d^="M21 12a9"]){animation:spin .9s linear infinite}
.btn{transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary:hover{box-shadow:0 10px 24px rgba(47,91,255,.28)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ———— Чат поддержки (виджет) ———— */
.cw{position:fixed;right:24px;bottom:24px;z-index:60;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#0E1220}
.cw>summary{list-style:none;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border-radius:999px;background:#2F5BFF;color:#FFFFFF;font:600 15px/1 'Onest',system-ui,sans-serif;box-shadow:0 16px 36px rgba(47,91,255,.35);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .16s;float:right}

.cw[open] .cw-x{display:block}

.cw-avs span+span{margin-left:-10px}

.sh-nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:#2F5BFF}
.sh-act{display:flex;gap:8px;align-items:center;flex:none}
.sh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:0;font:600 14px/1 'Onest',system-ui,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;box-sizing:border-box}
.sh-btn:hover{transform:translateY(-1px)}
.sh-pri{background:#2F5BFF;color:#FFFFFF}.sh-pri:hover{background:#1F45D6;color:#FFFFFF;box-shadow:0 10px 24px rgba(47,91,255,.28)}
.sh-gho{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.sh-gho:hover{background:#F5F6F9;color:#0E1220}
.sh-ava{position:relative;width:40px;height:40px;border-radius:50%;background:#E6ECFF;color:#1F45D6;display:inline-flex;align-items:center;justify-content:center;font:600 15px/1 'Onest',system-ui,sans-serif;text-decoration:none;flex:none}
.sh-ava:hover{color:#1F45D6}
.sh-burger{display:none;width:40px;padding:0}
.sf{background:#FFFFFF;border-top:1px solid #EDEFF3;padding:64px 0 0;overflow:hidden;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#0E1220}
.sf-w{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;flex-direction:column;gap:56px;box-sizing:border-box}
.sf-mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5A6175}
.sf-col{display:flex;flex-direction:column;gap:12px;font-size:15px}
.sf-col a{color:#2B3142;text-decoration:none;transition:color .16s}.sf-col a:hover{color:#2F5BFF}
.sf-pay{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:10px;background:#FFFFFF;font-size:13px;font-weight:500;color:#2B3142}
.sf-line{margin-top:-16px;padding-bottom:40px}.sf-line svg{display:block;width:100%;height:auto;overflow:visible}@keyframes sfDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.sf-draw{stroke-dasharray:1;animation:sfDraw 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes sfFlow{to{stroke-dashoffset:-56}}.sf-flow{animation:sfFlow 2.4s linear infinite}@keyframes sfPulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(3);opacity:0}}.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sfPulse 2.4s ease-out infinite}
@media (max-width:899px){.sh-nav{display:none !important}.sh-hm{display:none !important}.sh-burger{display:inline-flex}}
@media (max-width:767px){.sf-w{padding:0 16px}}

    <h1 class="t-h1">Оформление заказа</h1>

          </div>

            <div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px 0 16px; border-radius: 16px; box-sizing: border-box; border: 1px solid {{eBorder}}; background: {{eBg}}">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;authorized&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;lowBalance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2030}}">
class Component extends DCLogic {
  renderVals() {
    const v = this._rv0() || {};
    const s = this.state || {};
    const toast = (t) => () => { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 2200); };
    return Object.assign(v, PS.vals(), {
      toastOn: !!s.toast, toastText: s.toast || '',
      langLbl: s.uiLang === 'en' ? 'RU' : 'EN', langAria: s.uiLang === 'en' ? 'Переключить на русский' : 'Switch to English',
      toggleLang: () => { const en = s.uiLang !== 'en'; this.setState({ uiLang: en ? 'en' : 'ru' }); toast(en ? 'Switched to English' : 'Сайт на русском')(); },
      
    });
  }

  constructor(props) {
    super(props);
    this.state = { email: null, eErr: '', m: PSA.authed() && PSA.user().set.balFirst && PSA.balance().total > 0 ? 0 : -1, mErr: false, promo: '', pErr: '', applied: '', agree: false, aErr: false, tried: false, ready: false, useBal: false, bal: '100', bErr: '', qty: 1, top: 0, removed: false };
  }
  _rv0() {
    const s = this.state;
    const O = PS.order();
    const SUM = O.price * s.qty;
    const DISC = s.applied ? Math.round(SUM * 0.1) : 0;
    const TOT = SUM - DISC;
    const R = (n) => PS.fmt(n) + ' ₽';
    const raw = [
      { key: 'wallet', title: 'С баланса', sub: (PSA.balance().total < TOT ? 'Доступно ' + R(PSA.balance().total) + ' · остаток доплатите по СБП или в USDT' : 'Доступно ' + R(PSA.balance().total) + ' · без комиссии'), hint: 'Спишем с баланса — без комиссии сети и ввода реквизитов. Не хватает? Пополните баланс USDT в кабинете.' },
      { key: 'sbp', title: 'СБП', sub: 'Оплата из приложения любого банка, без комиссии', hint: 'Покажем QR-код или откроем приложение банка — подтвердите перевод, и eSIM придёт сразу.' },
      { key: 'crypto', title: 'Криптовалюта', sub: 'USDT в сетях TRON, TON, BEP-20', hint: 'Покажем адрес и QR-код для перевода. eSIM придёт после подтверждения в сети.' }
    ];
    const valid = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const typos = { 'gmal.com': 'gmail.com', 'gmial.com': 'gmail.com', 'yandx.ru': 'yandex.ru', 'mial.ru': 'mail.ru' };
    const authed = PSA.authed();
    const BALT = PSA.balance().total;
    const LOWB = authed && BALT < TOT;
    const splitOn = LOWB && BALT > 0 && s.m === 0;
    const em = s.email ?? (authed ? PSA.user().email : PS.qp('email'));
    const dom = (em.split('@')[1] || '').toLowerCase();
    const typoFix = typos[dom] ? em.split('@')[0] + '@' + typos[dom] : '';
    const low = LOWB;
    const TOPS = ['СБП', 'USDT'];
    const tops = TOPS.map((label, i) => { const on = s.top === i; return { label, on: on ? 'true' : 'false', bg: on ? '#0E1220' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0E1220', ring: on ? 'none' : 'inset 0 0 0 1px #E3E6ED', pick: () => this.setState({ top: i }) }; });
    const methods = raw.map((m, i) => ({ m, i })).filter(({ m }) => m.key !== 'wallet' || (PSA.authed() && PSA.balance().total > 0)).map(({ m, i }) => {
      const on = s.m === i;
      return {
        ...m, on: on ? 'true' : 'false',
        isCard: m.key === 'card', isSbp: m.key === 'sbp', isCrypto: m.key === 'crypto', isWallet: m.key === 'wallet', isStars: m.key === 'stars',
        ring: on ? 'inset 0 0 0 2px #2F5BFF' : (s.mErr ? 'inset 0 0 0 1px #C62F35' : 'inset 0 0 0 1px #E3E6ED'),
        bg: on ? '#F2F5FF' : '#FFFFFF', iconBg: on ? '#FFFFFF' : '#F5F6F9',
        dot: on ? '6px solid #2F5BFF' : (s.mErr ? '2px solid #C62F35' : '2px solid #C5CAD6'),
        pick: () => this.setState({ m: i, mErr: false })
      };
    });
    const check = () => {
      const v = em.trim();
      const eErr = !v ? 'Укажите email — на него придёт eSIM' : (!valid(v) ? 'Похоже, в адресе ошибка. Пример: name@mail.ru' : '');
      return { eErr, mErr: s.m < 0, aErr: !s.agree };
    };
    const errs = [];
    if (s.tried) {
      if (s.eErr) errs.push('email');
      if (s.mErr) errs.push('способ оплаты');
      if (s.aErr) errs.push('согласие с офертой');
    }
    const promoUp = (s.promo || '').trim().toUpperCase();
    const BAL = 150;
    const SAVED = authed ? [[PSA.user().email, '']].concat((PSA.user().emails || []).map((x) => [x, ''])) : [];
    const saved = SAVED.map(([mail]) => { const on = em.trim().toLowerCase() === mail; return { mail, on: on ? 'true' : 'false', ring: on ? 'none' : 'inset 0 0 0 1px #E3E6ED', bg: on ? '#E6ECFF' : '#FFFFFF', fg: on ? '#1F45D6' : '#5A6175', pick: () => this.setState({ email: mail, eErr: '', ready: false }) }; });
    const amt = parseInt(String(s.bal).replace(/\D/g, ''), 10) || 0;
    const bErr = !s.useBal ? '' : (amt <= 0 ? 'Укажите сумму больше нуля' : (amt > BAL ? 'На балансе только ' + BAL + ' ₽' : ''));
    const used = s.useBal && !bErr ? amt : 0;
    const quick = [['50 ₽', '50'], ['100 ₽', '100'], ['Всё · 150 ₽', '150']].map(([label, v]) => {
      const on = s.useBal && String(amt) === v;
      return { label, bg: on ? '#2F5BFF' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0E1220', pick: () => this.setState({ bal: v, bErr: '' }) };
    });
    return {
      email: em, hasEmail: !!em, eErr: s.eErr, hasEErr: !!s.eErr, eInvalid: s.eErr ? 'true' : 'false',
      eBorder: s.eErr ? '#C62F35' : '#E3E6ED', eBg: s.eErr ? '#FFFBFB' : '#FFFFFF',
      hasTypo: !s.eErr && !!typoFix, typoFix,
      onEmail: (e) => this.setState({ email: e.target.value, eErr: '', ready: false }),
      clearEmail: () => this.setState({ email: '', eErr: '' }),
      fixTypo: () => this.setState({ email: typoFix }),
      methods, hasMErr: s.mErr, hasHint: s.m >= 0 && !(low && s.m === 0 && authed), hint: s.m >= 0 ? raw[s.m].hint : '',
      promo: s.promo, promoApplied: !!s.applied, promoEditing: !s.applied, promoCode: s.applied,
      promoEmpty: !promoUp, pErr: s.pErr, hasPErr: !!s.pErr, pInvalid: s.pErr ? 'true' : 'false',
      noPromoMsg: PSA.DEMO && !s.pErr && !s.applied,
      pBorder: s.pErr ? '#C62F35' : '#E3E6ED', pBg: s.pErr ? '#FFFBFB' : '#FFFFFF',
      applyBg: promoUp ? '#F2F5FF' : '#F5F6F9', applyFg: promoUp ? '#1F45D6' : '#8C92A3',
      onPromo: (e) => this.setState({ promo: e.target.value, pErr: '' }),
      applyPromo: () => {
        if (!promoUp) return;
        const pr = PSA.checkPromo(promoUp);
        if (pr.ok) return this.setState({ applied: pr.code, pErr: '', promo: '' });
        this.setState({ pErr: pr.err });
      },
      removePromo: () => this.setState({ applied: '' }),
      qty: s.qty, multi: s.qty > 1, single: s.qty <= 1, inCart: !s.removed, removed: s.removed, removeItem: () => this.setState({ removed: true }), restoreItem: () => this.setState({ removed: false, qty: 1 }), qMinDis: s.qty <= 1, qMaxDis: s.qty >= 10,
      qMinus: () => this.setState({ qty: Math.max(1, s.qty - 1) }), qPlus: () => this.setState({ qty: Math.min(10, s.qty + 1) }),
      qtyNote: 'Придёт ' + s.qty + ' отдельных QR‑код' + (s.qty < 5 ? 'а' : 'ов') + ' на один email',
      pkgLabel: s.qty > 1 ? 'Пакет × ' + s.qty : 'Пакет', pkgSum: s.qty > 1 ? R(O.price) + ' × ' + s.qty : R(O.price),
      emailTitle: authed ? 'Email для eSIM и квитанции' : 'Email для eSIM, квитанции и создания профиля',
      saved, inputLabel: authed ? 'Email для eSIM' : 'Email',
      emailNote: authed ? 'Пришлём QR-код и квитанцию на этот адрес — можно указать почту друга. eSIM в любом случае появится в вашем кабинете.' : 'Пришлём QR-код, инструкцию и квитанцию. На этот email автоматически создадим личный кабинет — без пароля, вход по коду.',
      authed, guestBal: !authed, useBal: s.useBal, useBalAria: s.useBal ? 'true' : 'false',
      balBg: s.useBal ? '#FFF6EF' : '#F5F6F9', balRing: s.useBal ? 'inset 0 0 0 2px #FF7A45' : 'none',
      swBg: s.useBal ? '#FF7A45' : '#C5CAD6', swX: s.useBal ? 'translateX(18px)' : 'none',
      toggleBal: () => this.setState({ useBal: !s.useBal }),
      balAmt: s.bal, onBal: (e) => this.setState({ bal: e.target.value.replace(/\D/g, '').slice(0, 5) }),
      bErr, hasBErr: !!bErr, balOk: s.useBal && !bErr, bInvalid: bErr ? 'true' : 'false', bBorder: bErr ? '#C62F35' : '#E3E6ED',
      quick, balLine: authed, walLine: authed && s.m === 0, balUsed: used, balLeft: BAL - used,
      splitOn, tops, topName: TOPS[s.top], walAmt: splitOn ? '−' + R(BALT) : '−' + R(TOT),
      payBtn: splitOn ? 'Доплатить ' + R(TOT - BALT) + ' · ' + TOPS[s.top] : (authed && s.m === 0 ? 'Оплатить с баланса' : 'Оплатить ' + R(TOT)), totalLabel: splitOn ? R(TOT - BALT) : (authed && s.m === 0 ? '0 ₽' : R(TOT)),
      disc: s.applied ? '−' + R(DISC) : '—', psO: { name: O.info.name, flag: O.isRegion ? O.info.icon : O.info.flag, photo: O.info.photo, line: O.label + ' · ' + (O.isRegion ? O.info.n + ' стран' : O.info.net), back: O.back }, psMinus80: PS.fmt(TOT - BALT), psSuccess: PS.successUrl(O), psBalT: R(BALT), psLogin: PSA.loginUrl(PS.checkoutBack()), psHasAcc: !authed && PSA.validEmail(em) && PSA.hasAccount(em), psPay: PS.payUrl(O, s.m), discColor: s.applied ? '#0B7A3E' : '#0E1220',
      agree: s.agree, agreeAria: s.agree ? 'true' : 'false', hasAErr: s.aErr,
      boxBg: s.agree ? '#2F5BFF' : (s.aErr ? '#FFFBFB' : '#FFFFFF'),
      boxBorder: s.agree ? '0' : (s.aErr ? '2px solid #C62F35' : '2px solid #C5CAD6'),
      toggleAgree: () => this.setState({ agree: !s.agree, aErr: false }),
      hasSummary: errs.length > 1, summary: errs.join(', '),
      ready: s.ready, notReady: !s.ready,
      pay: () => {
        const r = check();
        const ok = !r.eErr && !r.mErr && !r.aErr;
        this.setState({ ...r, tried: true, ready: ok });
        if (ok && s.removed) { this.setState({ ready: false, toast: 'Корзина пуста — выберите пакет' }); return; }
        if (ok) {
          const method = s.m === 0 ? (splitOn ? ['sbp', 'usdt'][s.top] : 'balance') : (s.m === 2 ? 'usdt' : 'sbp');
          PSA.then(PSA.createOrder({ kind: 'esim', code: O.code, pkg: O.pkg, d: O.d, qty: s.qty, email: em.trim(), method, useBal: splitOn ? BALT : 0, promo: s.applied }), (o) => {
            if (!o || o.err) return this.setState({ ready: false });
            clearTimeout(this._go); this._go = setTimeout(() => PS.go(o.status === 'paid' ? PSA.doneUrl(o) : PSA.payUrl(o)), 900);
          });
        }
      }
    };
  }
}
</script>
