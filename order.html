<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1080px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(32px,4vw,48px);line-height:1.1;letter-spacing:-0.03em;font-weight:600;text-wrap:balance}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-lg{height:56px;padding:0 28px;font-size:17px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
@media (max-width:767px){.wrap{padding:0 16px}}
/* движение */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
main>*{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.12s}
main>div:first-child svg path{stroke-dasharray:300;animation:draw 1.4s .2s cubic-bezier(.2,.8,.2,1) both}

      hasNote: !!NOTE[E.st], note: NOTE[E.st] ? NOTE[E.st][0] : '', noteC: NOTE[E.st] ? NOTE[E.st][1] : 'gray',
      cabTitle: PSA.authed() ? 'eSIM уже в\u00a0вашем кабинете' : 'Личный кабинет создан на\u00a0' + em, cabHref: PSA.authed() ? 'account.html' : 'login.html?email=' + encodeURIComponent(em) + '&next=account.html' } : { email: '', what: '', stText: '', pbg: '', pfg: '', installUrl: '#', smdpAddr: '', act: '', hasNote: false, note: '', noteC: 'gray', cabTitle: '', cabHref: 'account.html' };
    const psTabs = LIST.map((x, i) => { const on = (this.state.ix || 0) === i; return { label: 'eSIM ' + (i + 1), on: on ? 'true' : 'false', bg: on ? '#0E1220' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0E1220', ring: on ? 'none' : 'inset 0 0 0 1px #E3E6ED', pick: () => this.setState({ ix: i }) }; });
    return { psE, psPrep: prep, psReady: !prep && !!E && { new: 1, failed: 1 }[E.st] === 1, qrN: q.n, qrCells: q.cells, psMulti: LIST.length > 1, psCount: LIST.length, psTabs, tabs, c, steps: all[this.state.os].map((x) => ({ ...x, hasTag: !!x.tag })) };
  }
