<style>
body{margin:0;background:#FFFFFF;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.nav a{color:#0E1220;text-decoration:none}.nav a:hover{color:#2F5BFF}
.dnav a{display:block;padding:12px 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;line-height:21px;transition:background-color .16s}
.dnav a:hover{background:#F5F6F9;color:#0E1220}
.dnav a.on{background:#F2F5FF;color:#1F45D6;font-weight:600}
.prose h2{margin:48px 0 16px;font-size:24px;line-height:30px;letter-spacing:-0.02em;font-weight:600;scroll-margin-top:96px}
.prose p{margin:0 0 16px;font-size:17px;line-height:28px;color:#2B3142;max-width:68ch}

<div role="note" class="short">In short: you're buying an eSIM with mobile internet abroad. The price in rubles is locked when you proceed to payment. Install the eSIM the day before your flight; the plan period starts from the first connection in the destination country. Until the eSIM is installed, we'll refund the full amount to your balance right away. After installation, refunds are by request only and at our discretion.</div>
<p>The Seller, {{psSel.name}} (details in section 10), offers any person with legal capacity to buy mobile data access abroad via eSIM on the terms below. Paying for an order means accepting this offer.</p>
<h2 id="o1">1. Definitions</h2>
<div class="cl"><span class="mono" style="color: #5A6175">1.1</span><span><b style="font-weight: 600; color: #0E1220">Service</b>  — the privetsim.net website, the Telegram bot and the “Privet SIM” Telegram Mini App.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.2</span><span><b style="font-weight: 600; color: #0E1220">eSIM</b>  — a digital profile installed on a compatible phone via a QR code or activation code.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.3</span><span><b style="font-weight: 600; color: #0E1220">Plan</b>  — a data allowance and validity period in a country or region. Either “for the whole period” or “with a daily limit”.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.4</span><span><b style="font-weight: 600; color: #0E1220">Activation</b>  — the first connection of the eSIM to a network in the coverage country.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.5</span><span><b style="font-weight: 600; color: #0E1220">Balance</b>  — the amount in rubles in your account. It consists of your own funds and bonuses.</span></div>
<h2 id="o2">2. Subject</h2>
<div class="cl"><span class="mono" style="color: #5A6175">2.1</span><span>The Seller provides the Buyer with an eSIM with the selected plan, and the Buyer pays for it.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.2</span><span>The Seller is not a telecom operator. Connectivity is provided by local carriers through the eSIM supplier. Carriers and network type are listed on the country page.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.3</span><span>The eSIM provides mobile internet only. There is no phone number, calls or SMS.</span></div>
<h2 id="o3">3. Order and payment</h2>
<div class="cl"><span class="mono" style="color: #5A6175">3.1</span><span>To place an order, the Buyer selects a plan and enters an email. After the first order, an account is automatically created for that email.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.2</span><span>The price is shown in rubles and may change with the exchange rate. The price shown when proceeding to payment is locked for that order.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.3</span><span>Payment methods: via SBP — the transfer is accepted on behalf of the Seller by the money transfer operator Murmansk Settlement Bank LLC (INN 5190103184); from the account balance (bonuses are used first); in USDT on TON, TRC-20 or BEP-20 (section 4). The transfer operator is not a party to the contract. The SBP payment link is valid for 30 minutes; after that, an unpaid payment is cancelled and the order must be placed again.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.4</span><span>An order is considered paid once the Seller receives payment confirmation from the transfer operator or from the blockchain. The payment confirmation is sent by email and kept in your account.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">3.5</span><span>Promo codes are valid under the terms of the specific promotion and cannot be exchanged for money. A promo code can be used once per email and once per card or wallet.</span></div>
<h2 id="o4">4. Cryptocurrency payment</h2>
<div class="cl"><span class="mono" style="color: #5A6175">4.1</span><span>The USDT amount is calculated at the Service exchange rate when the invoice is created. The invoice is valid for 30 minutes.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">4.2</span><span>The Buyer transfers exactly the stated amount on the stated network and, for TON, with the stated comment. Network and exchange fees are paid by the Buyer.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">4.3</span><span>If more than the invoice amount arrives, the excess is credited to the balance. If less arrives, or after the invoice expires, the amount received is credited to the balance at the current Service rate.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">4.4</span><span>A transfer on another network, in another coin or without a comment may be lost. The Seller will help find it but does not guarantee a refund.</span></div>
<h2 id="o5">5. eSIM delivery and installation</h2>
<div class="cl"><span class="mono" style="color: #5A6175">5.1</span><span>The QR code, manual installation details and instructions are sent by email and appear in your account, usually within a few minutes of payment. If the eSIM is not issued within 1 hour, the Seller issues it again or refunds the payment in full.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">5.2</span><span>Before paying, the Buyer checks that the phone supports eSIM and isn't carrier-locked. The list on the “Compatibility” page is for reference only.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">5.3</span><span>The eSIM must be installed within 180 days of purchase. After that, an uninstalled eSIM stops working.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">5.4</span><span>The QR code is single-use. Once installed, the eSIM is tied to the phone: it can't be moved to another device or restored after deletion.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">5.5</span><span>Until the eSIM is installed, the Buyer can send it to another person from the account.</span></div>
<h2 id="o6">6. Validity and top-ups</h2>
<div class="cl"><span class="mono" style="color: #5A6175">6.1</span><span>The plan period runs from activation, or, for plans where this is stated on the plan page, from eSIM installation. A day is counted as 24 hours from activation, not by the calendar: an N-day plan ends exactly N × 24 hours after activation. The plan ends when the period expires or the data is used up, whichever comes first. Unused data expires at the end of the period.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">6.2</span><span>On plans with a daily limit, once the daily allowance is used up, the speed is reduced to the one stated in the plan description.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">6.3</span><span>While the plan is active, you can buy more data or days for the same eSIM if the plan supports it. After the period ends, the eSIM can't be topped up; you need a new one.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">6.4</span><span>Remaining data in the account is updated with a delay of up to 3 hours. The actual remaining data may be less than shown.</span></div>
<h2 id="o7">7. Balance</h2>
<div class="cl"><span class="mono" style="color: #5A6175">7.1</span><span>The balance is topped up with USDT cryptocurrency. The amount in rubles is calculated at the Service rate shown on the top-up screen.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">7.2</span><span>The balance can be used to pay for eSIMs and top-ups in full or in part. The balance doesn't expire, can't be withdrawn and can't be transferred to other users.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">7.3</span><span>When an account is deleted, the remaining own funds can be refunded by request before deletion. Bonuses are canceled on deletion.</span></div>
<h2 id="o8">8. Liability</h2>
<div class="cl"><span class="mono" style="color: #5A6175">8.1</span><span>The Seller is not responsible for the quality and coverage of local carriers' networks, restrictions on services imposed by the authorities of the country of stay (for example, messenger calls), or apps that restrict access from foreign IP addresses.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">8.2</span><span>The Seller is not responsible if the eSIM doesn't work because the Buyer deleted it, configured the phone incorrectly (for example, didn't turn on data roaming) or installed it on an incompatible device.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">8.3</span><span>The Seller's liability is limited to the cost of the disputed order.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">8.4</span><span>Using the eSIM for spam, fraud or resale without a contract with the Seller is prohibited. In case of violation, the Seller may suspend the eSIM without a refund.</span></div>
<h2 id="o9">9. Refunds and disputes</h2>
<div class="cl"><span class="mono" style="color: #5A6175">9.1</span><span>Refunds are made by request only. Until the eSIM is installed and activated, the refund is full. After installation, the request is reviewed individually. See the Refund Policy for details.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">9.2</span><span>Disputes are resolved through negotiation via support. A claim can be sent to support@privetsim.net; the response time is 10 days. If no agreement is reached, the dispute is settled in court under the laws of the Russian Federation.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">9.3</span><span>The Seller may amend this offer. The new version applies to orders paid after its publication.</span></div>
<h2 id="o10">10. Company details</h2>
<p>Full details of the Seller and the transfer operator are on the “Company details” tab.</p>

<div role="note" class="short">In short: we refund the money if the eSIM hasn't been installed or activated. If the eSIM is already installed, a refund isn't guaranteed, but we'll review your case individually on request.</div>
<h2 id="r1">When we refund</h2>
<div class="tbl"><sc-raw-table><sc-raw-thead><sc-raw-tr><sc-raw-th>Situation</sc-raw-th><sc-raw-th>How much we refund</sc-raw-th></sc-raw-tr></sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>The eSIM hasn't been installed or activated (status “Waiting to be installed”)</sc-raw-td><sc-raw-td>100%</sc-raw-td></sc-raw-tr><sc-raw-tr><sc-raw-td>The eSIM was not issued within 1 hour of payment</sc-raw-td><sc-raw-td>100%</sc-raw-td></sc-raw-tr><sc-raw-tr><sc-raw-td>A data top-up that was paid but not applied to the eSIM</sc-raw-td><sc-raw-td>100% of the top-up</sc-raw-td></sc-raw-tr></sc-raw-tbody></sc-raw-table></div>
<h2 id="r2">If the eSIM is already installed</h2>
<p>Once installed, the eSIM is tied to the phone, and an automatic refund isn't possible. If the eSIM doesn't work or works poorly, contact support: we'll try to fix it first. If it can't be fixed, you can submit a refund request. We'll review it individually and may refund in full or in part, or decline.</p>
<p>We usually don't refund if:</p>
<ul><li>The eSIM worked and the data or validity was used up.</li><li>The eSIM was deleted from the phone or installed on a phone without eSIM support or one that's carrier-locked.</li><li>There's no network in a place outside the carrier's coverage (mountains, sea, airplane).</li><li>Certain apps don't work because of a foreign IP address or restrictions in the country of stay.</li></ul>
<h2 id="r3">How to request a refund</h2>
<div class="cl"><span class="mono" style="color: #5A6175">1.1</span><span>An uninstalled eSIM can be refunded right away, without review: in your account on the eSIM page → “Purchase and top-ups” → “Refund”. The refund is processed instantly and the eSIM is disabled. For an installed eSIM, refunds are by request only: in the same place or via support with the order number.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.2</span><span>An uninstalled eSIM can be refunded until its installation period expires: 180 days after purchase.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.3</span><span>A request for an installed eSIM can be submitted no later than the end of its validity period. We review it within 24 hours. Support may ask for screenshots of your settings and a description of the problem.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.4</span><span>The decision and request status are sent by email and shown in your account.</span></div>
<h2 id="r4">Where and how fast</h2>
<div class="cl"><span class="mono" style="color: #5A6175">2.1</span><span>We always refund to the balance in your account, in rubles, right after the refund is processed or approved. You can use it to pay for any eSIM or top-up.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.2</span><span>You can get refunded money to your account via SBP or in USDT by a separate request to support. Funds usually arrive instantly, in rare cases within up to 3 business days.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.3</span><span>If you paid in USDT, the payout on request is sent in USDT to the wallet the payment came from, in the same USDT amount minus the network fee, without conversion at a new rate. If you paid from an exchange, include your address on the same network in the request.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">2.4</span><span>Referral bonuses are returned as bonuses to the balance and aren't paid out. Promo code discounts aren't refunded.</span></div>
<p>When an order is refunded, the referral reward for that order is canceled. After the refund, the eSIM is disabled.</p>

<div role="note" class="short">In short: your friend gets 100 ₽ off their first purchase with your code, and you get 20% of every payment they make, up to 3,000 ₽ per friend, credited to your balance after their eSIM ends. Bonuses are spent on eSIMs and can't be withdrawn.</div>
<div class="cl"><span class="mono" style="color: #5A6175">1.1</span><span><b style="font-weight: 600; color: #0E1220">Who can participate.</b>  Any user with an account. The link and code are in the “Invite friends” section.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.2</span><span><b style="font-weight: 600; color: #0E1220">How a friend is linked.</b>  A friend signs up via the link, enters the code at sign-up, or enters it as a promo code in the cart on their first purchase. The inviter can't be changed afterwards.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.3</span><span><b style="font-weight: 600; color: #0E1220">Discount for your friend.</b>  100 ₽ off their first eSIM purchase. The discount is applied once in the cart, right at checkout, and can't be combined with other promo codes.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.4</span><span><b style="font-weight: 600; color: #0E1220">Referrer's reward.</b>  20% of the amount the friend actually paid for eSIMs and data top-ups. Excluding payments made with bonuses and promo code discounts. No reward is credited for balance top-ups.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.5</span><span><b style="font-weight: 600; color: #0E1220">When it's credited.</b>  The reward reaches your balance when your friend's eSIM ends: its validity runs out or it expires without being installed. After that, a refund for it is no longer possible. Until then, the credit shows in your account as “pending” with the expected date. No more than 3,000 ₽ in total per invited friend: once the rewards for a friend reach 3,000 ₽, no more are credited for them. There's no limit on the number of friends.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.6</span><span><b style="font-weight: 600; color: #0E1220">Refunds.</b>  If the friend got a refund for an order, the pending reward for it is canceled. The friend can file a claim on the eSIM no later than the end of its validity, so once the eSIM ends, the reward is final.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.7</span><span><b style="font-weight: 600; color: #0E1220">How to spend.</b>  Bonuses can cover up to 100% of the cost of eSIMs and top-ups, and they're used first. Bonuses don't expire, but can't be withdrawn as cash or transferred.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.8</span><span><b style="font-weight: 600; color: #0E1220">Restrictions.</b>  You can only invite new users. The reward isn't credited and the friend's discount doesn't apply if the friend pays with the same card, the same wallet or from the same device as the referrer. Inviting yourself or creating additional accounts for yourself is prohibited. Promoting the link via spam or using the “Privet SIM” brand in search ads is prohibited.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.9</span><span><b style="font-weight: 600; color: #0E1220">Violations.</b>  In case of abuse, the Seller may cancel unfairly obtained bonuses and disable participation in the program.</span></div>
<div class="cl"><span class="mono" style="color: #5A6175">1.10</span><span><b style="font-weight: 600; color: #0E1220">Changes.</b>  The Seller may change or end the program with 30 days' notice to participants. Bonuses already credited are kept.</span></div>

<p>We collect only the data needed to issue an eSIM, accept payment and provide support. We do not collect passport or card details. Data controller: {{psSel.name}}, contact privacy@privetsim.net.</p>
<h2 id="p1">What we collect and why</h2>

<p>We send promotional emails only with consent. You can unsubscribe in your profile or via the link in the email. Service emails about orders are always sent.</p>
<h2 id="p2">Who we share it with</h2>
<div class="tbl"><sc-raw-table><sc-raw-thead><sc-raw-tr><sc-raw-th>Recipient</sc-raw-th><sc-raw-th>What</sc-raw-th><sc-raw-th>Purpose</sc-raw-th></sc-raw-tr></sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>eSIM supplier</sc-raw-td><sc-raw-td>order and eSIM data, without email</sc-raw-td><sc-raw-td>issuing and servicing eSIMs</sc-raw-td></sc-raw-tr><sc-raw-tr><sc-raw-td>Transfer operator Murmansk Settlement Bank LLC (INN 5190103184)</sc-raw-td><sc-raw-td>amount and order number</sc-raw-td><sc-raw-td>accepting payments and refunds</sc-raw-td></sc-raw-tr><sc-raw-tr><sc-raw-td>Email service</sc-raw-td><sc-raw-td>email address and message text</sc-raw-td><sc-raw-td>sending emails</sc-raw-td></sc-raw-tr><sc-raw-tr><sc-raw-td>AI service for the support chat</sc-raw-td><sc-raw-td>chat messages and order data needed to reply</sc-raw-td><sc-raw-td>automatic chat replies; a human agent joins when needed</sc-raw-td></sc-raw-tr></sc-raw-tbody></sc-raw-table></div>
<p>We don't sell data. We share it with others only upon a lawful request from government authorities.</p>
<h2 id="p3">Where and how long we store it</h2>
<ul><li>Data is stored on servers in the Russian Federation.</li><li>Account and orders: while the account is active and for 3 years after the last order. Payment records are kept for as long as tax law requires.</li><li>Support conversations: 3 years.</li><li>Cookies: up to 12 months.</li></ul>
<h2 id="p4">Your rights</h2>
<p>You can find out what data we store, correct it, withdraw consent to marketing emails and delete your account. You can delete your account in your profile: active eSIMs will keep working until the end of their validity. We accept requests at privacy@privetsim.net and reply within 10 business days.</p>
