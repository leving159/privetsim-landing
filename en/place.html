body{margin:0;background:#FFFFFF;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}

.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.t-h2{margin:0;font-size:clamp(24px,2.4vw,30px);line-height:1.2;letter-spacing:-0.02em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}

      <div class="sh-act"><button type="button" class="sh-btn sh-gho sh-hm" hreflang="ru" lang="ru" aria-label="{{langAria}}" title="Русский" sc-camel-on-click="{{toggleLang}}"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>{{langLbl}}</button><sc-if value="{{psGuest}}" hint-placeholder-val="{{ true }}"><a class="sh-btn sh-gho sh-hm" href="login">Log in</a></sc-if><sc-if value="{{psAuthed}}" hint-placeholder-val="{{ false }}"><a class="sh-ava sh-hm" href="account" aria-label="{{psAvaAria}}">{{psAva}}</a></sc-if><a class="sh-btn sh-pri" href="countries">Buy eSIM</a><a class="sh-btn sh-gho sh-burger" href="menu" aria-label="Open menu"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></div>
    </div>
  </header>

  <main class="wrap" style="padding-top: 32px; padding-bottom: 120px; display: flex; flex-direction: column; gap: 48px">
    <nav aria-label="Breadcrumbs" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: #5A6175">
      <a href="./" style="color: #5A6175; text-decoration: none">Home</a><span aria-hidden="true">/</span>
      <a href="{{p.cHref}}" style="color: #5A6175; text-decoration: none">{{p.country}}</a><span aria-hidden="true">/</span>
      <span aria-current="page" style="color: #0E1220">{{p.title}}</span>
    </nav>

    <!-- Заголовок -->
    <header class="hero" style="display: flex; flex-direction: column; gap: 14px; max-width: 860px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 5px; border-radius: 999px; background: #F5F6F9; color: #0E1220; font-size: 13px; font-weight: 600"><sc-if value="{{p.hasFlag}}" hint-placeholder-val="{{ true }}"><img loading="lazy" decoding="async" src="{{p.flag}}" alt="" style="width: 24px; height: 24px; display: block"></sc-if>{{p.country}}</span>
      <h1 style="margin: 0; font-size: clamp(40px, 5.4vw, 72px); line-height: 1.02; letter-spacing: -0.04em; font-weight: 600">{{p.title}}</h1>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; color: #5A6175"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FF7A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{p.where}}</span>
    </header>

    <!-- Галерея -->
    <section aria-labelledby="gal-h" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <h2 id="gal-h" class="t-h2">Gallery</h2>
        <span class="mono" style="font-size: 13px; color: #5A6175">{{gNum}} / {{gTotal}} · use the arrows or tap a photo</span>
      </div>
      <div class="g-stage" sc-camel-on-click="{{openLb}}" role="button" tabindex="0" aria-label="Open photo full screen">
        <sc-for list="{{gCur}}" as="c" hint-placeholder-count="1">
          <img loading="lazy" decoding="async" src="{{c.src}}" alt="{{c.cap}}">
        </sc-for>
        <span aria-hidden="true" style="position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(180deg, rgba(14,18,32,0), rgba(14,18,32,.6)); pointer-events: none"></span>
        <span style="position: absolute; left: 24px; bottom: 20px; right: 120px; color: #FFFFFF; font-size: 16px; font-weight: 500; pointer-events: none">{{gCap}}</span>
        <span style="position: absolute; right: 20px; bottom: 18px; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(8px); color: #FFFFFF; font-size: 13px; pointer-events: none"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>Full screen</span>
        <button class="g-nav" type="button" sc-camel-on-click="{{prev}}" aria-label="Previous photo" style="left: 20px"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <button class="g-nav" type="button" sc-camel-on-click="{{next}}" aria-label="Next photo" style="right: 20px"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <div class="g-strip" role="tablist" aria-label="Thumbnails">
        <sc-for list="{{gal}}" as="g" hint-placeholder-count="5">
          <button class="g-th" type="button" role="tab" aria-selected="{{g.on}}" aria-label="{{g.cap}}" sc-camel-on-click="{{g.pick}}" style="opacity: {{g.op}}; box-shadow: {{g.ring}}"><img loading="lazy" decoding="async" src="{{g.src}}" alt=""></button>
        </sc-for>
      </div>
      <sc-if value="{{lb}}" hint-placeholder-val="{{ false }}">
        <div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
          <button type="button" sc-camel-on-click="{{closeLb}}" aria-label="Close" style="position: absolute; top: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          <sc-for list="{{gCur}}" as="c" hint-placeholder-count="1"><img loading="lazy" decoding="async" src="{{c.src}}" alt="{{c.cap}}"></sc-for>
          <span style="color: #FFFFFF; font-size: 16px">{{gCap}} <span class="mono" style="color: #8C92A3; margin-left: 8px">{{gNum}} / {{gTotal}}</span></span>
          <button class="g-nav" type="button" sc-camel-on-click="{{prev}}" aria-label="Previous photo" style="left: 24px"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="g-nav" type="button" sc-camel-on-click="{{next}}" aria-label="Next photo" style="right: 24px"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        </div>
      </sc-if>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
      <div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 48px">
        <section style="display: flex; flex-direction: column; gap: 16px">
          <h2 class="t-h2">What this place is</h2>
          <p style="margin: 0; font-size: 18px; line-height: 29px; color: #2B3142; max-width: 680px">{{p.about}}</p>
          <sc-if value="{{p.hasNote}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 12px 16px; border-radius: 14px; background: #FFF6E5; color: #8A5300; font-size: 14px; line-height: 21px; max-width: 680px">{{p.note}}</p>
          </sc-if>
        </section>

        <!-- Чем заняться -->
        <section style="display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap">
            <h2 class="t-h2">Things to do</h2>
            <div role="tablist" aria-label="Filter" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #F5F6F9; gap: 4px">
              <sc-for list="{{doTabs}}" as="t" hint-placeholder-count="3">
                <button role="tab" type="button" aria-selected="{{t.on}}" sc-camel-on-click="{{t.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; font: 600 13px/1 'Onest', system-ui, sans-serif; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}">{{t.label}}</button>
              </sc-for>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px">
            <sc-for list="{{todo}}" as="d" hint-placeholder-count="4">
              <article class="todo">
                <span class="todo-ph"><img loading="lazy" decoding="async" src="{{d.img}}" alt="{{d.t}}"><span class="todo-tag" style="background: {{d.tbg}}; color: {{d.tfg}}">{{d.kind}}</span></span>
                <span style="display: flex; flex-direction: column; gap: 6px; padding: 4px 6px 6px">
                  <b style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">{{d.t}}</b>
                  <span style="font-size: 14px; line-height: 21px; color: #5A6175">{{d.d}}</span>
                  <span style="display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px">
                    <span class="todo-meta"><svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>{{d.time}}</span>
                    <span class="todo-meta"><svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><path d="M7.5 7.5h.01"></path></svg>{{d.tip}}</span>
                  </span>
                </span>
              </article>
            </sc-for>
          </div>
        </section>

        <!-- Как добраться: карта -->
        <section style="display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap">
            <h2 class="t-h2">How to get there</h2>
            <span style="font-size: 14px; color: #5A6175">Choose where you're coming from</span>
          </div>
          <div role="tablist" aria-label="Departure city" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{orig}}" as="o" hint-placeholder-count="3">
              <button role="tab" type="button" aria-selected="{{o.on}}" sc-camel-on-click="{{o.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 0; cursor: pointer; font: 600 14px/1 'Onest', system-ui, sans-serif; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; transition: background-color .2s, color .2s">
                <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
                {{o.n}}<span style="font-weight: 500; opacity: .7">{{o.best}}</span>
              </button>
            </sc-for>
          </div>
          <div style="position: relative; border-radius: 28px; overflow: hidden; background: #E6ECFF; box-shadow: inset 0 0 0 1px #DCE4FF">
            <svg width="100%" sc-camel-view-box="{{mp.vb}}" role="img" aria-label="Route map" style="display: block">
              <defs>
                <pattern id="mgrid" width="40" height="40" sc-camel-pattern-units="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#D3DCFF" stroke-width="1"></path></pattern>
                <filter id="msh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" sc-camel-std-deviation="8" flood-color="#0E1220" flood-opacity=".12"></feDropShadow></filter>
              </defs>
              <rect width="100%" height="100%" fill="url(#mgrid)"></rect>
              <path d="{{mp.other}}" fill="#F5F6F9" stroke="#C9D5FF" stroke-width="1" stroke-linejoin="round"></path>
              <path d="{{mp.main}}" fill="#FFFFFF" stroke="#9DB0FF" stroke-width="1.5" stroke-linejoin="round" filter="url(#msh)"></path>
              <path d="{{rt.others}}" fill="none" stroke="#5A6175" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round" opacity=".45"></path>
              <path d="{{rt.sel}}" fill="none" stroke="#2F5BFF" stroke-opacity=".18" stroke-width="12" stroke-linecap="round"></path>
              <path class="mroute" d="{{rt.sel}}" sc-camel-path-length="1" fill="none" stroke="#2F5BFF" stroke-width="3.5" stroke-linecap="round"></path>
              <path class="mflow" d="{{rt.sel}}" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 10"></path>
            </svg>
            <!-- подписи и точки поверх карты -->
            <div style="position: absolute; inset: 0; pointer-events: none">
              <sc-for list="{{mp.lb}}" as="l" hint-placeholder-count="2">
                <span class="mlb" style="left: {{l.px}}; top: {{l.py}}; font-size: {{l.fs}}px; font-style: {{l.st}}; letter-spacing: {{l.ls}}; color: {{l.fill}}">{{l.t}}</span>
              </sc-for>
              <sc-for list="{{orig}}" as="o" hint-placeholder-count="3">
                <button type="button" class="mcity" sc-camel-on-click="{{o.pick}}" style="left: {{o.px}}; top: {{o.py}}; flex-direction: {{o.dir}}">
                  <span class="mdot" style="width: {{o.size}}px; height: {{o.size}}px; background: {{o.dot}}"></span>
                  <span class="mname" style="font-weight: {{o.fw}}; background: {{o.lbg}}; color: {{o.lfg}}">{{o.label}}</span>
                </button>
              </sc-for>
              <span class="mbadge" style="left: {{rt.px}}; top: {{rt.py}}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{rt.icon}}"></path></svg></span>
              <span class="mdest" style="left: {{mp.dpx}}; top: {{mp.dpy}}; flex-direction: {{mp.ddir}}">
                <span class="mpin"><span class="mpp"></span></span>
                <span class="mname" style="font-weight: 700; background: #FF7A45; color: #FFFFFF">{{mp.dn}}</span>
              </span>
            </div>
            <span style="position: absolute; right: 14px; top: 12px; height: 26px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,.9); font-size: 12px; line-height: 26px; color: #5A6175">Diagram, not to navigator scale</span>
          </div>
          <sc-if value="{{mp.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #8A5300">{{mp.note}}</span></sc-if>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px">
            <sc-for list="{{opts}}" as="x" hint-placeholder-count="3">
              <div style="display: flex; gap: 12px; padding: 16px; border-radius: 20px; background: {{x.bg}}; box-shadow: {{x.ring}}">
                <span style="width: 40px; height: 40px; border-radius: 12px; background: {{x.ibg}}; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{x.ifg}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.icon}}"></path></svg></span>
                <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap"><b style="font-size: 15px; font-weight: 600">{{x.name}}</b><span class="mono" style="font-size: 13px; color: #2F5BFF">{{x.t}}</span></span><span style="font-size: 13px; line-height: 19px; color: #5A6175">{{x.d}}</span></span>
              </div>
            </sc-for>
          </div>
          <p style="margin: 0; font-size: 14px; line-height: 21px; color: #5A6175; max-width: 680px">{{p.how}} Travel time is approximate — check the schedule before your trip.</p>
        </section>

        <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px">
          <div class="fact">
            <span class="fact-i"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px; font-weight: 600">When to go</b><span style="font-size: 15px; line-height: 22px; color: #5A6175">{{p.when}}</span></span>
          </div>
          <div class="fact">
            <span class="fact-i"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 18v-2M9 18v-5M14 18v-8M19 18V6"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px; font-weight: 600">Connectivity on site</b><span style="font-size: 15px; line-height: 22px; color: #5A6175">{{p.net}}</span></span>
          </div>
          <div class="fact">
            <span class="fact-i"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px; font-weight: 600">Travel tip</b><span style="font-size: 15px; line-height: 22px; color: #5A6175">{{p.tip}}</span></span>
          </div>
        </section>
      </div>

      <!-- Покупка -->
      <aside style="flex: 1 1 320px; min-width: 0">
        <div class="sticky" style="display: flex; flex-direction: column; gap: 18px; padding: 24px; border-radius: 28px; border: 1px solid #E3E6ED; background: #FFFFFF">
          <span style="display: flex; align-items: center; gap: 12px"><sc-if value="{{p.hasFlag}}" hint-placeholder-val="{{ true }}"><img loading="lazy" decoding="async" src="{{p.flag}}" alt="" style="width: 44px; height: 44px; display: block"></sc-if><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 18px; font-weight: 600">eSIM · {{p.country}}</b><span style="font-size: 14px; color: #5A6175">from {{p.from}} ₽ · {{p.gen}}</span></span></span>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #2B3142">
            <li style="display: flex; gap: 10px"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B7A3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Install the day before your flight — it starts working after landing</li>
            <li style="display: flex; gap: 10px"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B7A3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Your main number and bank SMS stay</li>
            <li style="display: flex; gap: 10px"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B7A3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Top-ups without a new eSIM</li>
          </ul>
          <a class="btn btn-primary btn-lg" href="{{p.cHref}}" style="width: 100%; box-sizing: border-box">Choose a plan<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
          <a class="btn btn-ghost" href="compatibility" style="width: 100%; box-sizing: border-box">Check your phone</a>
        </div>
      </aside>
    </div>

    <!-- Всё для поездки -->
    <section aria-labelledby="trip-h" style="display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
