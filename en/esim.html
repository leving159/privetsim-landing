<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(30px,3.4vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:600}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-secondary{background:#F2F5FF;color:#1F45D6}.btn-secondary:hover{background:#E6ECFF;color:#1F45D6}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;font-weight:500;transition:background-color .16s}
.side a:hover{background:#EDEFF3;color:#0E1220}

@keyframes rfOk{0%,55%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.7)}60%{opacity:1;transform:translateX(-50%) scale(1.08)}64%,92%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%)}}

.sh-ava{position:relative;width:40px;height:40px;border-radius:50%;background:#E6ECFF;color:#1F45D6;display:inline-flex;align-items:center;justify-content:center;font:600 15px/1 'Onest',system-ui,sans-serif;text-decoration:none;flex:none}
.sh-ava:hover{color:#1F45D6}
.sh-burger{display:none;width:40px;padding:0}
.sf{background:#FFFFFF;border-top:1px solid #EDEFF3;padding:64px 0 0;overflow:hidden;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#0E1220}
.sf-w{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;flex-direction:column;gap:56px;box-sizing:border-box}
.sf-mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5A6175}
.sf-col{display:flex;flex-direction:column;gap:12px;font-size:15px}
.sf-col a{color:#2B3142;text-decoration:none;transition:color .16s}.sf-col a:hover{color:#2F5BFF}
.sf-pay{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:10px;background:#FFFFFF;font-size:13px;font-weight:500;color:#2B3142}
.sf-line{margin-top:-16px;padding-bottom:40px}.sf-line svg{display:block;width:100%;height:auto;overflow:visible}@keyframes sfDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.sf-draw{stroke-dasharray:1;animation:sfDraw 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes sfFlow{to{stroke-dashoffset:-56}}.sf-flow{animation:sfFlow 2.4s linear infinite}@keyframes sfPulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(3);opacity:0}}.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sfPulse 2.4s ease-out infinite}
@media (max-width:899px){.sh-nav{display:none !important}.sh-hm{display:none !important}.sh-burger{display:inline-flex}}
@media (max-width:767px){.sf-w{padding:0 16px}}
