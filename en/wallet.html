<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(30px,3.4vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:600}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-secondary{background:#F2F5FF;color:#1F45D6}.btn-secondary:hover{background:#E6ECFF;color:#1F45D6}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;font-weight:500;transition:background-color .16s}
.side a:hover{background:#EDEFF3;color:#0E1220}

.xm-h b{flex:1;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-0.02em}
.xm-x{width:40px;height:40px;border-radius:50%;border:0;background:#F5F6F9;color:#0E1220;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.xm-kv{display:flex;flex-direction:column;border-top:1px solid #EDEFF3}
.xm-kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #EDEFF3;font-size:14px;line-height:20px}
.xm-kv span{color:#5A6175}.xm-kv b{font-weight:500;text-align:right}
.xm-btns{display:flex;flex-wrap:wrap;gap:8px}
.xm-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:0;font:600 15px/1 'Onest',system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box;flex:1}
.xm-pri{background:#2F5BFF;color:#FFFFFF}.xm-pri:hover{background:#1F45D6;color:#FFFFFF}
.xm-gho{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.xm-gho:hover{background:#F5F6F9;color:#0E1220}
.xm-note{padding:12px 14px;border-radius:14px;background:#F5F6F9;color:#5A6175;font-size:13px;line-height:19px}
.xm-toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:130;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px 0 16px;border-radius:999px;background:#0E1220;color:#FFFFFF;font:500 14px/1 'Onest',system-ui,sans-serif;box-shadow:0 12px 32px rgba(14,18,32,.24);white-space:nowrap}
</style>
</helmet>
<div style="background: #F5F6F9; ">

  <!-- Шапка (единая) -->
  <header class="sh">
    <div class="sh-in">
      <a class="sh-logo" href="index.html" aria-label="Privet SIM — home"><svg width="32" height="32" sc-camel-view-box="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#2F5BFF"></rect><circle cx="13.5" cy="15.5" r="3.2" fill="#FFFFFF"></circle><circle cx="26.5" cy="15.5" r="3.2" fill="#FF7A45"></circle><path d="M11 23.5C13.5 30.5 26.5 30.5 29 23.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"></path></svg><span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-size: 22px; font-weight: 700; letter-spacing: -0.04em; line-height: 1">Privet</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.04em; line-height: 1; color: #FFFFFF; background: #2F5BFF; border-radius: 5px; padding: 4px 6px">SIM</span></span><span class="sh-sep sh-hm" aria-hidden="true"></span><span class="sh-desc sh-hm">Travel eSIM<br>in 200+ countries</span></a>
      <nav class="sh-nav" aria-label="Main"><a href="countries.html">Countries</a><a href="index.html#how">How it works</a><a href="compatibility.html">Compatibility</a><a href="help.html">Help</a></nav>
      <div class="sh-act"><button type="button" class="sh-btn sh-gho sh-hm" hreflang="ru" lang="ru" aria-label="{{langAria}}" title="Русский" sc-camel-on-click="{{toggleLang}}"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>{{langLbl}}</button><sc-if value="{{psChip}}" hint-placeholder-val="{{ true }}"><a class="sh-btn sh-gho sh-hm" href="{{psChipHref}}" aria-label="{{psChipAria}}" style="gap: 10px; padding: 0 14px 0 8px"><img loading="lazy" decoding="async" src="{{psChipFlag}}" alt="" style="width: 24px; height: 24px"><span style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; line-height: 1">{{psChipText}}</span><span style="width: 64px; height: 4px; border-radius: 999px; background: #EDEFF3; overflow: hidden"><span style="display: block; width: {{psChipW}}; height: 100%; border-radius: 999px; background: #2F5BFF"></span></span></span></a></sc-if><a class="sh-btn sh-pri" href="countries.html">Buy eSIM</a><sc-if value="{{psAuthed}}" hint-placeholder-val="{{ true }}"><a class="sh-ava sh-hm" href="profile.html" aria-label="{{psAvaAria}}">{{psAva}}<span aria-hidden="true" style="position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #0B7A3E; box-shadow: 0 0 0 2px #FFFFFF"></span></a></sc-if><sc-if value="{{psGuest}}" hint-placeholder-val="{{ false }}"><a class="sh-btn sh-gho sh-hm" href="login.html">Log in</a></sc-if><a class="sh-btn sh-gho sh-burger" href="menu.html" aria-label="Open menu"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></div>
    </div>
  </header>

  <div class="wrap" style="padding-top: 40px; padding-bottom: 120px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <nav class="side" aria-label="Account" style="flex: 1 1 220px; max-width: 100%; display: flex; flex-direction: column; gap: 4px">
      <a href="account.html">
        <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><rect x="9" y="11" width="6" height="6" rx="1"></rect></svg>My eSIMs</a>
      <a class="on" href="wallet.html" aria-current="page"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h11v4"></path><path d="M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"></path><path d="M16 14.5h1"></path></svg>Balance<span class="mono" style="margin-left: auto; font-size: 12px; font-weight: 500; color: #5A6175">{{psBal}}</span></a>
      <a href="profile.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
      <a href="referral.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="4" rx="1"></rect><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zM12 8c1.5-3 5-3.5 5-1.5S14 8 12 8z"></path></svg><span style="white-space: nowrap">Invite friends</span><span style="margin-left: auto; flex: none; white-space: nowrap; height: 22px; padding: 0 7px; border-radius: 8px; background: #FF7A45; color: #0E1220; font: 600 12px/22px 'Onest', system-ui, sans-serif">20%</span></a>
      <a href="#chat"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4z"></path></svg>Support</a>
      <a href="legal.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>Documents</a>
      <a href="login.html?logout=1"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg>Log out</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 class="t-h1">Balance</h1>
        <p style="margin: 0; font-size: 15px; line-height: 23px; color: #5A6175">Top up once — and buy eSIMs and gigabytes in one tap</p>
      </div>

      <!-- Единый баланс -->
      <section aria-label="Your balance" class="wb-main">
        <span aria-hidden="true" class="wb-glow"></span>
        <div style="position: relative; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-end; justify-content: space-between">
          <span style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 14px; color: #C9D5FF">Balance</span>
            <span style="display: flex; align-items: baseline; gap: 10px"><b class="mono" style="font-size: 52px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">{{totalBal}}</b><span style="font-size: 24px; font-weight: 600">₽</span></span>
            <span style="font-size: 13px; color: #C9D5FF">Can be spent on any eSIMs and top-ups · doesn't expire</span>
          </span>
          <span style="display: flex; gap: 8px">
            <button class="btn btn-sm" type="button" sc-camel-on-click="{{focusTop}}" style="background: #FFFFFF; color: #1F45D6">Top up</button>
            <a class="btn btn-sm" href="countries.html" style="background: rgba(255,255,255,.16); color: #FFFFFF">Buy eSIM</a>
          </span>
        </div>
        <div style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 20px; background: rgba(255,255,255,.12)"><span style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 24px; font-size: 14px">
            <span style="display: inline-flex; align-items: center; gap: 8px"><i class="wb-dot" style="background: rgb(255, 122, 69)"></i>Invite friends and get 20% of their payments</span>
            <a href="referral.html" style="color: rgb(255, 255, 255); font-weight: 600; text-decoration: none">Get 20% from friends →</a>
          </span>
        </div>
      </section>

      <!-- Пополнение -->
      <section id="topup" aria-labelledby="top-h" style="padding: 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 22px; box-shadow: {{topRing}}; transition: box-shadow .3s">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
          <h2 id="top-h" class="t-h3">Top up balance</h2>
          <div role="tablist" aria-label="Top-up method" class="seg">
            <sc-for list="{{ways}}" as="w" hint-placeholder-count="2">
              <button role="tab" type="button" aria-selected="{{w.on}}" sc-camel-on-click="{{w.pick}}" style="background: {{w.bg}}; color: {{w.fg}}; box-shadow: {{w.sh}}">{{w.label}}</button>
            </sc-for>
          </div>
        </div>

        <!-- Шаг 1: сумма и сеть -->
        <sc-if value="{{stForm}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 22px">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <b style="font-size: 15px; font-weight: 600">Amount</b>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px">
                <sc-for list="{{amts}}" as="a" hint-placeholder-count="4">
                  <button type="button" sc-camel-on-click="{{a.pick}}" class="am" style="box-shadow: {{a.ring}}; background: {{a.bg}}">
                    <sc-if value="{{a.hit}}" hint-placeholder-val="{{ false }}"><span class="am-hit">Best value</span></sc-if>
                    <span class="mono" style="font-size: 20px; font-weight: 500">{{a.label}}</span>
                    <span style="font-size: 12px; color: #5A6175">{{a.sub}}</span>
                  </button>
                </sc-for>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid {{inBorder}}; box-sizing: border-box">
                <input type="text" inputmode="decimal" value="{{amt}}" sc-camel-on-change="{{onAmt}}" aria-label="Custom amount" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 500 18px/1 'JetBrains Mono', monospace; color: #0E1220">
                <span style="font-size: 15px; font-weight: 600; color: #5A6175">{{cur}}</span>
              </div>
              <sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 13px; color: #C62F35">{{err}}</span></sc-if>
            </div>

            <sc-if value="{{isCrypto}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px">
                  <b style="font-size: 15px; font-weight: 600">Network</b>
                  <div role="radiogroup" aria-label="USDT network" class="nt-seg">
                    <sc-for list="{{nets}}" as="n" hint-placeholder-count="3">
                      <button type="button" role="radio" aria-checked="{{n.on}}" sc-camel-on-click="{{n.pick}}" style="background: {{n.bg}}; color: {{n.fg}}; box-shadow: {{n.sh}}">{{n.name}}</button>
                    </sc-for>
                  </div>
                </div>
                <span style="font-size: 13px; line-height: 19px; color: #5A6175">{{netSub}} · network fee  <b class="mono" style="font-weight: 500; color: {{netFeeFg}}">{{netFee}}</b>. Tip: top up 50–100 USDT at once — the fee is charged for each transfer.</span>
              </div>
            </sc-if>

            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid #EDEFF3">
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #5A6175">We'll credit to your balance</span><b style="font-size: 18px; font-weight: 600">{{credit}}</b><span style="font-size: 12px; color: #8C92A3">{{rateNote}}</span></span>
              <button class="btn btn-primary" type="button" sc-camel-on-click="{{next}}" style="min-width: 220px">{{nextLabel}}</button>
            </div>
          </div>
        </sc-if>

        <!-- Шаг 2: адрес для перевода -->
        <sc-if value="{{stAddr}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
            <div class="qr" aria-label="Address QR code" style="grid-template-columns: repeat({{qrN}}, 1fr)">
              <sc-for list="{{qr}}" as="q" hint-placeholder-count="20"><i style="background: {{q}}"></i></sc-for>
              <span class="qr-logo"><svg width="28" height="28" sc-camel-view-box="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#2F5BFF"></rect><circle cx="13.5" cy="15.5" r="3.2" fill="#FFFFFF"></circle><circle cx="26.5" cy="15.5" r="3.2" fill="#FF7A45"></circle><path d="M11 23.5C13.5 30.5 26.5 30.5 29 23.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"></path></svg></span>
            </div>
            <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
              <div class="ad-f"><span class="ad-l">Amount</span><span style="display: flex; align-items: center; gap: 10px"><b class="mono" style="flex: 1; font-size: 20px; font-weight: 500">{{amtShow}} USDT</b><button class="lnk" type="button" sc-camel-on-click="{{copyA}}">{{cA}}</button></span><span style="font-size: 12px; color: #8C92A3">{{netName}} network · send only USDT on this network</span></div>
              <div class="ad-f"><span class="ad-l">Address</span><span style="display: flex; align-items: center; gap: 10px"><b class="mono" style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500; word-break: break-all">{{addr}}</b><button class="lnk" type="button" sc-camel-on-click="{{copyB}}">{{cB}}</button></span></div>
              <sc-if value="{{needMemo}}" hint-placeholder-val="{{ false }}">
                <div class="ad-f" style="background: #FFF6E5; box-shadow: inset 0 0 0 1px #F5D9A6"><span class="ad-l" style="color: #8A5A00">Comment (memo) — required</span><span style="display: flex; align-items: center; gap: 10px"><b class="mono" style="flex: 1; font-size: 18px; font-weight: 500">{{memo}}</b><button class="lnk" type="button" sc-camel-on-click="{{copyC}}">{{cC}}</button></span><span style="font-size: 12px; color: #8A5A00">Without the comment we won't know whose transfer it is</span></div>
              </sc-if>
              <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F2F5FF; font-size: 13px; line-height: 19px; color: #1F45D6">
                <span class="spin" aria-hidden="true"></span>
                <span style="flex: 1">Waiting for the transfer. The address is valid for 30 minutes; we'll credit it automatically 1–3 minutes after it arrives.</span>
              </div>
              <span style="display: flex; gap: 8px; flex-wrap: wrap">
                <button class="btn btn-primary" type="button" sc-camel-on-click="{{sent}}">I've sent it</button>
                <button class="btn btn-ghost" type="button" sc-camel-on-click="{{back}}">Change amount or network</button>
              </span>
            </div>
          </div>
        </sc-if>

        <!-- Шаг 3: зачислено -->
        <sc-if value="{{stDone}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 20px; border-radius: 22px; background: #EAF7EF">
            <span class="ok-ic"><svg width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            <span style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px"><b style="font-size: 20px; font-weight: 600">Balance topped up by {{doneLabel}}</b><span style="font-size: 14px; color: #2B3142">Now you can pay for eSIMs and gigabytes from your balance — no fees, no payment details.</span></span>
            <span style="display: flex; gap: 8px"><a class="btn btn-primary btn-sm" href="countries.html">Buy eSIM</a><button class="btn btn-ghost btn-sm" type="button" sc-camel-on-click="{{back}}">Top up again</button></span>
          </div>
        </sc-if>
      </section>

      <!-- Чем отличаются -->
      <section aria-labelledby="diff-h" style="padding: 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
        <h2 id="diff-h" class="t-h3">How the balance works</h2>
        <ul class="wb-rules">
          <li><b>Where the money comes from</b><span>Your top-ups (SBP or USDT) and 20% of orders from invited friends</span></li>
          <li><b>What to spend it on</b><span>Any eSIMs and data top-ups, in full or in part</span></li>
          <li><b>Validity</b><span>Doesn't expire</span></li>
          <li><b>Payment methods</b><span>SBP, USDT and balance, eSIM auto top-up ·  <a href="payments.html">set up</a></span></li>
          <li><b>Withdrawal</b><span>Money can't be withdrawn from the balance — only spent on connectivity</span></li>
        </ul>
      </section>

      <!-- История -->
      <section aria-labelledby="hist-h" style="padding: 8px 28px 12px; border-radius: 28px; background: #FFFFFF">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 0 4px; flex-wrap: wrap">
          <h2 id="hist-h" class="t-h3">Transaction history</h2>
          <div role="tablist" aria-label="Filter" class="seg">
            <sc-for list="{{flt}}" as="f" hint-placeholder-count="3">
              <button role="tab" type="button" aria-selected="{{f.on}}" sc-camel-on-click="{{f.pick}}" style="background: {{f.bg}}; color: {{f.fg}}; box-shadow: {{f.sh}}">{{f.label}}</button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{noOps}}" hint-placeholder-val="{{ false }}"><div style="padding: 8px 0 16px"><div class="ps-fr ps-empty"><span class="ps-ico" aria-hidden="true"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 9h6M12 9v7"></path></svg></span><h3>No transactions yet</h3><p>Top up your balance or invite a friend.</p><div class="ps-btns"><a class="btn btn-primary" href="#topup">Top up</a> <a class="btn btn-ghost" href="referral.html">Invite friends</a></div></div></div></sc-if>
        <sc-for list="{{ops}}" as="o" hint-placeholder-count="5">
          <div class="op">
            <span class="op-ic" style="background: {{o.ibg}}"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{o.ifg}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
            <span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px; font-weight: 600">{{o.t}}</b><span style="font-size: 13px; color: #5A6175">{{o.d}}</span></span>
            <span class="wb-tag" style="background: {{o.tbg}}; color: {{o.tfg}}">{{o.bal}}</span>
            <b class="mono" style="min-width: 96px; text-align: right; font-size: 15px; font-weight: 500; color: {{o.afg}}">{{o.a}}</b>
          </div>
        </sc-for>
      </section>
    </main>
  </div>
  <!-- Подвал (единый) -->
  <footer class="sf">
    <div class="sf-w">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2660}}">
class Component extends (window.PSLogic || DCLogic) {
  renderVals() {
    const v = this._rv0() || {};
    const s = this.state || {};
    const toast = (t) => () => { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 2200); };
    return Object.assign(v, PS.vals(), {
      toastOn: !!s.toast, toastText: s.toast || '',
      langLbl: PS.lang === 'en' ? 'RU' : 'EN', langAria: PS.lang === 'en' ? 'Switch to Russian' : 'Switch to English',
      toggleLang: () => PS.switchLang(PS.lang === 'en' ? 'ru' : 'en'),
      
    });
  }

  constructor(props) { super(props); const po = PS.qp('paid') ? PSA.order(PS.qp('paid')) : null; this.state = { way: po && po.method === 'usdt' ? 'usdt' : 'rub', amt: { usdt: '100', rub: '3000' }, net: 1, step: po && po.status === 'paid' ? 'done' : 'form', err: '', flash: false, copied: '', flt: 'all', oid: po ? po.id : '' }; this._un = PSA.sub(() => this.setState({ v: Date.now() })); }
  _rv0() {
    const s = this.state;
    const fmt = PS.fmt;
    const isCrypto = s.way === 'usdt';
    const seg = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0E1220' : '#5A6175', sh: on ? '0 1px 2px rgba(14,18,32,.08)' : 'none', on: on ? 'true' : 'false' });
    const ways = [['rub', 'SBP'], ['usdt', 'USDT']].map(([id, label]) => ({ label, ...seg(s.way === id), pick: () => this.setState({ way: id, step: 'form', err: '' }) }));
    const raw = isCrypto
      ? [['20', 'for 1–2 eSIMs', false], ['50', 'for a trip', false], ['100', 'for several trips', true]]
      : [['1000', '', false], ['3000', '', true], ['5000', '', false]];
    const cur = isCrypto ? 'USDT' : '₽';
    const val = s.amt[s.way];
    const amts = raw.map(([v, sub, hit]) => {
      const on = val === v;
      return { label: (isCrypto ? v : fmt(v)) + ' ' + cur, sub: sub || (isCrypto ? '' : 'no fees'), hit: isCrypto && hit, ring: on ? 'inset 0 0 0 2px #2F5BFF' : 'inset 0 0 0 1px #E3E6ED', bg: on ? '#F2F5FF' : '#FFFFFF', pick: () => this.setState({ amt: { ...s.amt, [s.way]: v }, err: '' }) };
    });
    const FEES = [['≈ 1–3 $', 'TRC-20 · the most popular on exchanges'], ['≈ 0,1 $', 'Fast and cheap · Telegram Wallet, Tonkeeper'], ['≈ 0,1 $', 'BNB Smart Chain · Binance, Bybit']];
    const N = PSA.NETS[s.net];
    const nets = PSA.NETS.map((n, i) => {
      const on = s.net === i;
      return { name: n.name, on: on ? 'true' : 'false', fg: on ? '#0E1220' : '#5A6175', sh: on ? '0 1px 3px rgba(14,18,32,.12)' : 'none', ring: on ? 'inset 0 0 0 2px #2F5BFF' : 'inset 0 0 0 1px #E3E6ED', bg: on ? '#FFFFFF' : 'transparent', pick: () => this.setState({ net: i }) };
    });
    const num = parseFloat(String(val).replace(',', '.').replace(/[^\d.]/g, '')) || 0;
    const rate = PS.USDT_RATE;
    const rub = isCrypto ? Math.floor(num * rate) : Math.round(num);
    const O = s.oid ? PSA.order(s.oid) : null;
    if (O && s.step === 'check' && O.status === 'paid') setTimeout(() => this.setState({ step: 'done' }), 0);
    const next = () => {
      if (num <= 0) { this.setState({ err: 'Enter the top-up amount' }); return; }
      if (!isCrypto && num < 100) { this.setState({ err: 'The minimum amount is 100 ₽' }); return; }
      if (isCrypto && num < 5) { this.setState({ err: 'The minimum amount is 5 USDT' }); return; }
      if (num > 100000) { this.setState({ err: 'The amount is too large' }); return; }
      PSA.then(PSA.createOrder({ kind: 'balance', amount: rub, method: isCrypto ? 'usdt' : 'sbp', usdt: isCrypto ? num : 0, net: N.name }), (o) => {
        if (!o || o.err) return;
        if (isCrypto && PSA.DEMO) { this.setState({ step: 'addr', err: '', copied: '', oid: o.id }); }
        else PS.go(PSA.payUrl(o) + (isCrypto ? '&net=' + encodeURIComponent(N.name) : ''));
      });
    };
    const q = PSA.qr(N.addr);
    const copy = (k, t) => () => { PSA.copy(t); this.setState({ copied: k }); };
    const flts = [['all', 'All'], ['main', 'Top-ups and purchases'], ['bonus', 'For friends']];
    const flt = flts.map(([id, label]) => ({ label, ...seg(s.flt === id), pick: () => this.setState({ flt: id }) }));
    const P = { in: 'M12 19V5M5 12l7-7 7 7', out: 'M12 5v14M5 12l7 7 7-7', gift: 'M3.5 8h17v4h-17zM5 12v8h14v-8M12 8v12' };
    const all = PSA.ops();
    const ops = all.filter((o) => s.flt === 'all' || o.b === s.flt).map((o) => ({
      t: o.t, d: o.d, a: o.cancel ? '0 ₽' : (o.a > 0 ? '+' : '') + PSA.rub(o.a).replace('−', '−'), icon: P[o.kind] || P.in,
      bal: o.kind === 'gift' ? 'For friends' : (o.kind === 'in' ? 'Top-up' : 'Purchase'),
      tbg: o.b === 'main' ? '#F2F5FF' : '#FFF1E8', tfg: o.b === 'main' ? '#1F45D6' : '#8A3A12',
      ibg: o.kind === 'out' ? '#F5F6F9' : (o.kind === 'gift' ? '#FFF1E8' : '#E4F5EA'),
      ifg: o.kind === 'out' ? '#5A6175' : (o.kind === 'gift' ? '#E05A25' : '#0B7A3E'),
      afg: o.pend || o.cancel ? '#8C92A3' : (o.a > 0 ? '#0B7A3E' : '#0E1220')
    }));
    const B = PSA.balance();
    const doneO = O && O.status === 'paid' ? O : null;
    return {
      mainBal: fmt(B.own), totalBal: fmt(B.total), bonusW: Math.max(3, Math.round(B.bonus / Math.max(1, B.total) * 100)) + '%', ways, amts, cur, amt: val, inBorder: s.err ? '#C62F35' : '#E3E6ED', hasErr: !!s.err, err: s.err,
      onAmt: (e) => this.setState({ amt: { ...s.amt, [s.way]: e.target.value }, err: '' }),
      isCrypto, nets, feeMany: '', feeOne: '', netSub: FEES[s.net][1], netFee: FEES[s.net][0], netFeeFg: FEES[s.net][0].indexOf('0,1') >= 0 ? '#0B7A3E' : '#8A5A00',
      credit: isCrypto ? '≈ ' + fmt(rub) + ' ₽' : fmt(rub) + ' ₽',
      rateNote: isCrypto ? 'At the rate at the time of receipt · 1 USDT = ' + String(rate).replace(',', '.') + ' ₽' : 'No fees',
      nextLabel: isCrypto ? 'Get the transfer address' : 'Top up by ' + fmt(rub) + ' ₽',
      next,
      stForm: s.step === 'form', stAddr: s.step === 'addr' || s.step === 'check', stDone: s.step === 'done',
      qr: q.cells, qrN: q.n, amtShow: O && O.usdt ? String(O.usdt).replace(',', '.') : val, netName: N.name, addr: N.addr, needMemo: N.memo, memo: O ? O.no.replace(/\D/g, '') + '07' : '',
      cA: s.copied === 'a' ? 'Copied' : 'Copy', cB: s.copied === 'b' ? 'Copied' : 'Copy', cC: s.copied === 'c' ? 'Copied' : 'Copy',
      copyA: copy('a', O ? O.usdt : val), copyB: copy('b', N.addr), copyC: copy('c', O ? O.no.replace(/\D/g, '') + '07' : ''),
      sent: () => { if (!O) return; this.setState({ step: 'check' }); setTimeout(() => PSA.confirmPayment(O.id), 2500); },
      back: () => { if (O && O.status === 'pending') PSA.cancelOrder(O.id); this.setState({ step: 'form', copied: '', oid: '' }); },
      doneLabel: doneO ? (doneO.method === 'usdt' ? String(doneO.usdt).replace(',', '.') + ' USDT (' + PSA.rub(doneO.sum) + ')' : PSA.rub(doneO.sum)) : '',
      topRing: s.flash ? '0 0 0 3px rgba(47,91,255,.35)' : 'none',
      focusTop: () => { this.setState({ flash: true, step: 'form' }); try { document.getElementById('topup').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} setTimeout(() => this.setState({ flash: false }), 1200); },
      flt, ops, noOps: !ops.length
    };
  }
}
</script>
