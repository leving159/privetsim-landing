<style>
body{margin:0;background:#F5F6F9;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.t-h1{margin:0;font-size:clamp(30px,3.4vw,40px);line-height:1.15;letter-spacing:-0.025em;font-weight:600}
.t-h3{margin:0;font-size:20px;line-height:28px;letter-spacing:-0.01em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s cubic-bezier(.2,.8,.2,1),color .16s;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
.btn-primary{background:#2F5BFF;color:#FFFFFF}.btn-primary:hover{background:#1F45D6;color:#FFFFFF}
.btn-secondary{background:#F2F5FF;color:#1F45D6}.btn-secondary:hover{background:#E6ECFF;color:#1F45D6}
.btn-ghost{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.btn-ghost:hover{background:#F5F6F9;color:#0E1220}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;color:#2B3142;text-decoration:none;font-size:15px;font-weight:500;transition:background-color .16s}
.side a:hover{background:#EDEFF3;color:#0E1220}
.side a.on{background:#FFFFFF;color:#0E1220;font-weight:600;box-shadow:0 1px 2px rgba(14,18,32,0.06)}
.row{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid #EDEFF3;flex-wrap:wrap}
@media (max-width:899px){.side{flex-direction:row !important;overflow-x:auto}.side a{white-space:nowrap}}
@media (max-width:767px){.wrap{padding:0 16px}}
/* движение */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
main>*{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}main>*:nth-child(4){animation-delay:.24s}
[role=progressbar]>div{transform-origin:left;animation:grow 1.2s .4s cubic-bezier(.2,.8,.2,1) both}
.side a{transition:background-color .16s,color .16s,transform .2s}
.side a:hover{transform:translateX(2px)}
.btn{transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes coin{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.flow{stroke-dasharray:6 8;animation:flow 2.4s linear infinite}
.bob{animation:bob 5s ease-in-out infinite}
.coin{animation:coin 3.2s ease-in-out infinite}
@keyframes rfRoll{0%,74%{transform:translateY(0)}80%,94%{transform:translateY(-1.15em)}100%{transform:translateY(0)}}
@keyframes rfPlus{0%,72%{opacity:0;transform:translateY(8px) scale(.6)}78%{opacity:1;transform:translateY(0) scale(1.15)}82%,92%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes rfSend{0%,6%{transform:none;box-shadow:0 0 0 0 rgba(255,122,69,.6)}9%{transform:scale(.9)}14%{transform:none;box-shadow:0 0 0 10px rgba(255,122,69,0)}100%{transform:none}}
@keyframes rfPhone{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-6px)}}
@keyframes rfOk{0%,55%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.7)}60%{opacity:1;transform:translateX(-50%) scale(1.08)}64%,92%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%)}}
@keyframes rfRing{0%,54%{opacity:0;transform:scale(1)}58%{opacity:.8;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.7)}}
@keyframes cf{0%,57%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}61%{opacity:1;transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.3)) rotate(calc(var(--r)*.3)) scale(1)}80%{opacity:1}88%,100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 30px)) rotate(var(--r)) scale(.8)}}
@keyframes rfCoin{0%,57%{opacity:0;transform:translate(0,0) scale(.2) rotateY(0)}63%{opacity:1;transform:translate(0,-56px) scale(1.15) rotateY(180deg)}68%{transform:translate(0,-60px) scale(1) rotateY(360deg)}78%{opacity:1;transform:translate(-110px,-150px) scale(.55) rotateY(540deg)}80%,100%{opacity:0;transform:translate(-112px,-152px) scale(.4) rotateY(540deg)}}

.xm-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:0;font:600 15px/1 'Onest',system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box;flex:1}
.xm-pri{background:#2F5BFF;color:#FFFFFF}.xm-pri:hover{background:#1F45D6;color:#FFFFFF}
.xm-gho{background:#FFFFFF;color:#0E1220;box-shadow:inset 0 0 0 1px #E3E6ED}.xm-gho:hover{background:#F5F6F9;color:#0E1220}

</helmet>
<div style="background: #F5F6F9; ">

  <!-- Шапка (единая) -->
  <header class="sh">
    <div class="sh-in">
      <a class="sh-logo" href="index.html" aria-label="Привет SIM — на главную"><svg width="32" height="32" sc-camel-view-box="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#2F5BFF"></rect><circle cx="13.5" cy="15.5" r="3.2" fill="#FFFFFF"></circle><circle cx="26.5" cy="15.5" r="3.2" fill="#FF7A45"></circle><path d="M11 23.5C13.5 30.5 26.5 30.5 29 23.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"></path></svg><span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-size: 22px; font-weight: 700; letter-spacing: -0.04em; line-height: 1">Привет</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.04em; line-height: 1; color: #FFFFFF; background: #2F5BFF; border-radius: 5px; padding: 4px 6px">SIM</span></span><span class="sh-sep sh-hm" aria-hidden="true"></span><span class="sh-desc sh-hm">eSIM для&nbsp;путешествий<br>в&nbsp;200+ стран</span></a>
      <nav class="sh-nav" aria-label="Основная"><a href="countries.html">Страны</a><a href="index.html#how">Как&nbsp;это&nbsp;работает</a><a href="compatibility.html">Совместимость</a><a href="help.html">Помощь</a></nav>
      <div class="sh-act"><button type="button" class="sh-btn sh-gho sh-hm" hreflang="en" lang="en" aria-label="{{langAria}}" title="English" sc-camel-on-click="{{toggleLang}}"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>{{langLbl}}</button><sc-if value="{{psChip}}" hint-placeholder-val="{{ true }}"><a class="sh-btn sh-gho sh-hm" href="{{psChipHref}}" aria-label="{{psChipAria}}" style="gap: 10px; padding: 0 14px 0 8px"><img loading="lazy" decoding="async" src="{{psChipFlag}}" alt="" style="width: 24px; height: 24px"><span style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; line-height: 1">{{psChipText}}</span><span style="width: 64px; height: 4px; border-radius: 999px; background: #EDEFF3; overflow: hidden"><span style="display: block; width: {{psChipW}}; height: 100%; border-radius: 999px; background: #2F5BFF"></span></span></span></a></sc-if><a class="sh-btn sh-pri" href="countries.html">Купить eSIM</a><sc-if value="{{psAuthed}}" hint-placeholder-val="{{ true }}"><a class="sh-ava sh-hm" href="profile.html" aria-label="{{psAvaAria}}">{{psAva}}<span aria-hidden="true" style="position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #0B7A3E; box-shadow: 0 0 0 2px #FFFFFF"></span></a></sc-if><sc-if value="{{psGuest}}" hint-placeholder-val="{{ false }}"><a class="sh-btn sh-gho sh-hm" href="login.html">Войти</a></sc-if><a class="sh-btn sh-gho sh-burger" href="menu.html" aria-label="Открыть меню"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></div>
    </div>
  </header>

  <div class="wrap" style="padding-top: 40px; padding-bottom: 120px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <nav class="side" aria-label="Личный кабинет" style="flex: 1 1 220px; max-width: 100%; display: flex; flex-direction: column; gap: 4px">
      <a class="on" href="account.html" aria-current="page">
        <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><rect x="9" y="11" width="6" height="6" rx="1"></rect></svg>Мои eSIM</a>
      <a href="wallet.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h11v4"></path><path d="M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"></path><path d="M16 14.5h1"></path></svg>Баланс<span class="mono" style="margin-left: auto; font-size: 12px; font-weight: 500; color: #5A6175">{{psBal}}</span></a>
      <a href="profile.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Профиль</a>
      <a href="referral.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="4" rx="1"></rect><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zM12 8c1.5-3 5-3.5 5-1.5S14 8 12 8z"></path></svg><span style="white-space: nowrap">Позвать друзей</span><span style="margin-left: auto; flex: none; white-space: nowrap; height: 22px; padding: 0 7px; border-radius: 8px; background: #FF7A45; color: #0E1220; font: 600 12px/22px 'Onest', system-ui, sans-serif">25%</span></a>
      <a href="#chat"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4z"></path></svg>Поддержка</a>
      <a href="legal.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>Документы</a>
      <a href="login.html?logout=1"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg>Выйти</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <nav aria-label="Хлебные крошки" style="display: flex; gap: 8px; font-size: 14px; color: #5A6175"><a href="account.html" style="color: #5A6175; text-decoration: none">Мои eSIM</a><span aria-hidden="true">/</span><span aria-current="page" style="color: #0E1220">{{E.short}}</span></nav>

      <!-- Шапка eSIM -->
      <section aria-label="eSIM {{E.name}}" style="padding: 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch">
        <div class="es-card">
          <span style="display: flex; justify-content: space-between; align-items: center"><span style="display: inline-flex; align-items: center; gap: 5px"><b style="font-size: 18px; font-weight: 700; letter-spacing: -0.04em">Привет</b><span class="mono" style="font-size: 9px; padding: 3px 5px; border-radius: 5px; background: #FFFFFF; color: #2F5BFF">SIM</span></span><span style="width: 40px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #F4F6FB, #C9D0E0)"></span></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em"><img loading="lazy" decoding="async" src="{{E.flag}}" alt="" style="width: 24px; height: 24px">{{E.name}}</span><span class="mono" style="font-size: 12px; letter-spacing: .08em; opacity: .85">{{E.card}}</span></span>
        </div>
        <div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: {{stBg}}; color: {{stFg}}; font: 600 13px/1 'Onest', system-ui, sans-serif"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{stFg}}"></span>{{stText}}</span>
            <button type="button" sc-camel-on-click="{{copyIccid}}" class="es-copy mono">ICCID {{E.iccidFull}} <b>{{cIccid}}</b></button>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="display: flex; align-items: baseline; gap: 8px"><b class="mono" style="font-size: 40px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">{{uBig}}</b><span style="color: #5A6175">{{uSub}}</span></span><span class="mono" style="font-size: 15px">{{uDays}}</span></div>
          <span style="height: 10px; border-radius: 999px; background: #EDEFF3; overflow: hidden"><span style="display: block; width: {{uW}}; height: 100%; border-radius: 999px; background: {{uC}}"></span></span>
          <span style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: #5A6175"><span>{{uL}}</span><span>{{uR}}</span></span>
          <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}"><div class="ps-note ps-n-{{noteC}}">{{note}}</div></sc-if>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto">
            <sc-if value="{{E.canTopup}}" hint-placeholder-val="{{ true }}"><a class="btn btn-primary" href="{{topHref}}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Пополнить</a></sc-if><sc-if value="{{E.archived}}" hint-placeholder-val="{{ false }}"><a class="btn btn-primary" href="{{E.buyHref}}">Купить новую</a></sc-if><sc-if value="{{needHelp}}" hint-placeholder-val="{{ false }}"><a class="btn btn-primary" href="#chat">Написать в&nbsp;поддержку</a></sc-if>
            <sc-if value="{{showQr}}" hint-placeholder-val="{{ true }}"><a class="btn btn-ghost" href="#install">QR и&nbsp;установка</a></sc-if>
            <sc-if value="{{E.canSend}}" hint-placeholder-val="{{ false }}"><button class="btn btn-ghost" type="button" sc-camel-on-click="{{gOpenFn}}">Отправить другу</button></sc-if><sc-if value="{{canRefundEsim}}" hint-placeholder-val="{{ false }}"><button class="btn btn-ghost" type="button" sc-camel-on-click="{{refundEsim}}">Вернуть eSIM</button></sc-if>
          </div>
        </div>
      </section>

      <sc-if value="{{hasR}}" hint-placeholder-val="{{ false }}">
      <section aria-labelledby="rq-st-h" style="padding: 24px 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h2 id="rq-st-h" class="t-h3">Заявка {{R.no}}</h2><span class="ps-pill" style="background: {{R.pbg}}; color: {{R.pfg}}"><i></i>{{R.st}}</span></div>
        <div class="ps-kv"><div><span>Заказ</span><b>{{R.what}}</b></div><div><span>Сумма</span><b>{{R.sum}}</b></div><div><span>Заявка принята</span><b>{{R.when}}</b></div><div><span>{{R.k}}</span><b>{{R.v}}</b></div></div>
        <sc-if value="{{R.hasNote}}" hint-placeholder-val="{{ false }}"><div class="ps-note ps-n-{{R.noteC}}">{{R.note}}</div></sc-if>
        <sc-if value="{{R.chat}}" hint-placeholder-val="{{ false }}"><div class="ps-btns"><a class="btn btn-ghost" href="#chat">{{R.chatLabel}}</a><sc-if value="{{R.rejected}}" hint-placeholder-val="{{ false }}"><a class="btn btn-ghost" href="legal.html?doc=refund">Условия возврата</a></sc-if></div></sc-if>
      </section>
      </sc-if>

      <!-- Расход по дням -->
      <sc-if value="{{hasUsage}}" hint-placeholder-val="{{ true }}"><section aria-labelledby="use-h" style="padding: 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
          <h2 id="use-h" class="t-h3">Расход по&nbsp;дням</h2>
          <span style="font-size: 14px; color: #5A6175">В&nbsp;среднем <b class="mono" style="color: #0E1220; font-weight: 500">{{avg}}</b> в&nbsp;день</span>
        </div>
        <div class="es-chart" role="img" aria-label="Расход трафика за последние 7 дней">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <span class="es-col"><span class="mono es-v">{{d.v}}</span><span class="es-bar" style="height: {{d.h}}; background: {{d.c}}"></span><span class="es-d">{{d.d}}</span></span>
          </sc-for>
        </div>
        <sc-if value="{{fc}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 16px; border-radius: 16px; background: #FFF6E5">
          <span style="flex: 1 1 260px; font-size: 14px; line-height: 21px; color: #5C3D00">При&nbsp;таком расходе гигабайтов хватит примерно на <b>{{fcDays}}</b>, а&nbsp;eSIM действует ещё&nbsp;{{fcLeft}}. Пополните заранее&nbsp;— заработает сразу, переустанавливать ничего не&nbsp;нужно.</span>
          <sc-if value="{{hasUp}}" hint-placeholder-val="{{ true }}"><a class="btn btn-sm" href="{{topHref}}" style="background: #FFFFFF; color: #0E1220">{{upLabel}}</a></sc-if>
        </div></sc-if>
      </section></sc-if>

      <!-- Установка -->
      <section id="install" aria-labelledby="inst-h" style="padding: 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
          <h2 id="inst-h" class="t-h3">QR-код и&nbsp;установка</h2>
          <div role="tablist" aria-label="Способ установки" class="seg">
            <sc-for list="{{ways}}" as="w" hint-placeholder-count="3">
              <button role="tab" type="button" aria-selected="{{w.on}}" sc-camel-on-click="{{w.pick}}" style="background: {{w.bg}}; color: {{w.fg}}; box-shadow: {{w.sh}}">{{w.label}}</button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{noQr}}" hint-placeholder-val="{{ false }}"><div class="ps-note ps-n-gray">{{noQrText}}</div></sc-if>
        <sc-if value="{{showQr}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
          <div class="qr" aria-label="QR-код для установки eSIM" style="grid-template-columns: repeat({{qrN}}, 1fr)">
            <sc-for list="{{qr}}" as="q" hint-placeholder-count="20"><i style="background: {{q}}"></i></sc-for>
          </div>
          <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
            <sc-if value="{{wIos}}" hint-placeholder-val="{{ true }}">
              <ol class="es-steps"><li>Откройте эту страницу на&nbsp;iPhone, куда ставите eSIM, и&nbsp;нажмите кнопку ниже&nbsp;— iOS установит её&nbsp;сама.</li><li>Если открыли на&nbsp;компьютере&nbsp;— наведите камеру iPhone на&nbsp;QR-код.</li><li>Назовите линию «Привет SIM» и&nbsp;выберите её&nbsp;только для&nbsp;сотовых данных.</li></ol>
              <a class="btn btn-primary" href="{{E.installUrl}}" style="align-self: flex-start" target="_blank" rel="noopener">Установить на&nbsp;этот iPhone</a>
            </sc-if>
            <sc-if value="{{wAnd}}" hint-placeholder-val="{{ false }}">
              <ol class="es-steps"><li>Настройки → Подключения → Диспетчер SIM-карт → Добавить eSIM.</li><li>Выберите «Сканировать QR-код» и&nbsp;наведите камеру на&nbsp;код слева.</li><li>Включите новую линию для&nbsp;мобильных данных и&nbsp;роуминг.</li></ol>
            </sc-if>
            <sc-if value="{{wMan}}" hint-placeholder-val="{{ false }}">
              <div class="ad-f"><span class="ad-l">Адрес SM-DP+</span><span style="display: flex; align-items: center; gap: 10px"><b class="mono" style="flex: 1; font-size: 14px; font-weight: 500; word-break: break-all">{{E.smdpAddr}}</b><button class="lnk" type="button" sc-camel-on-click="{{copyA}}">{{cA}}</button></span></div>
              <div class="ad-f"><span class="ad-l">Код активации</span><span style="display: flex; align-items: center; gap: 10px"><b class="mono" style="flex: 1; font-size: 14px; font-weight: 500; word-break: break-all">{{E.act}}</b><button class="lnk" type="button" sc-camel-on-click="{{copyB}}">{{cB}}</button></span></div>
            </sc-if>
            <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F2F5FF; font-size: 13px; line-height: 19px; color: #1F45D6"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg><span>QR-код устанавливается один раз и&nbsp;только на&nbsp;один телефон. Не&nbsp;удаляйте eSIM из&nbsp;настроек&nbsp;— восстановить или&nbsp;перенести её&nbsp;нельзя.</span></div>
            <a href="help.html#install" style="font-size: 14px; font-weight: 600; text-decoration: none">Подробная инструкция с&nbsp;картинками →</a>
          </div>
        </div></sc-if>
      </section>

      <!-- Новый телефон -->
      <section id="move" aria-labelledby="move-h" style="padding: 24px 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #FFF6E5; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B26B00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"></rect><path d="M11 18h2"></path></svg></span>
        <span style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px"><h2 id="move-h" class="t-h3">Сменили телефон или&nbsp;удалили eSIM?</h2><span style="font-size: 15px; line-height: 23px; color: #5A6175">Активированную eSIM перенести на&nbsp;другой телефон нельзя&nbsp;— она привязывается к&nbsp;устройству при&nbsp;установке. Для&nbsp;нового телефона нужна новая eSIM.</span></span>
        <a class="btn btn-primary" href="{{E.buyHref}}">Купить новую eSIM</a>
      </section>

      <!-- История -->
      <section aria-labelledby="hist-h" style="padding: 8px 28px 12px; border-radius: 28px; background: #FFFFFF">
        <h2 id="hist-h" class="t-h3" style="padding: 20px 0 4px">Покупка и&nbsp;пополнения</h2>
        <sc-for list="{{hist}}" as="o" hint-placeholder-count="3">
          <div class="op">
            <span class="op-ic" style="background: {{o.ibg}}"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{o.ifg}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
            <span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px; font-weight: 600">{{o.t}}</b><span style="font-size: 13px; color: #5A6175">{{o.d}}</span></span>
