body{margin:0;background:#FFFFFF;color:#0E1220;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2F5BFF}a:hover{color:#1F45D6}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.sec{padding:120px 0}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2F5BFF}
.t-display{margin:0;font-size:clamp(44px,6.4vw,88px);line-height:1.02;letter-spacing:-0.04em;font-weight:600}
.t-h2{margin:0;font-size:clamp(30px,3.6vw,48px);line-height:1.1;letter-spacing:-0.03em;font-weight:600;text-wrap:balance}
.t-h3{margin:0;font-size:clamp(20px,1.8vw,24px);line-height:1.25;letter-spacing:-0.02em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font:600 16px/1 'Onest',system-ui,sans-serif;cursor:pointer;transition:background-color .16s,color .16s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;text-decoration:none;white-space:nowrap}

.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid rgba(47,91,255,.35);outline-offset:2px}
.btn .arr{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.btn:hover .arr{transform:translateX(3px)}
.btn-lg{height:56px;padding:0 28px;font-size:17px}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
